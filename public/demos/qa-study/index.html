<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>新人自学问答 · 电商 / 生服 / 广告</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fa; --bg2:#ffffff; --panel:#ffffff; --panel-b:#eef0f2; --hover:#f5f6f8;
  --txt:#262626; --txt-dim:#8a8f98; --txt-soft:#535862;
  --a1:#ffa116; --a1-soft:rgba(255,161,22,.12);
  --easy:#00af9b; --med:#ffb800; --hard:#ff375f;
  --easy-soft:rgba(0,175,155,.12); --med-soft:rgba(255,184,0,.14); --hard-soft:rgba(255,55,95,.12);
  --ok:#00af9b;
  --shadow:0 8px 24px -12px rgba(20,24,32,.16);
  --r:10px; --border:1px solid var(--panel-b);
}
html[data-theme="dark"]{
  --bg:#1a1a1a; --bg2:#262626; --panel:#282828; --panel-b:#3a3a3a; --hover:#2f2f2f;
  --txt:#eff1f6; --txt-dim:#8a8a8a; --txt-soft:#c5c6c9;
  --a1:#ffa116; --a1-soft:rgba(255,161,22,.16);
  --easy:#2cbb5d; --med:#ffc01e; --hard:#ef4743;
  --easy-soft:rgba(44,187,93,.14); --med-soft:rgba(255,192,30,.16); --hard-soft:rgba(239,71,67,.14);
  --ok:#2cbb5d;
  --shadow:0 12px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Noto Sans SC",system-ui,-apple-system,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--a1)}
.wrap{max-width:1280px;margin:0 auto;padding:20px 24px 70px}

/* topbar */
header.top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  background:var(--panel);border:var(--border);border-radius:var(--r);padding:16px 20px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{font-size:26px;line-height:1}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.2px}
.brand p{margin:2px 0 0;color:var(--txt-dim);font-size:12.5px;max-width:64ch}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:var(--border);background:var(--panel);color:var(--txt-soft);border-radius:8px;
  padding:8px 14px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit;font-weight:500}
.btn:hover{border-color:var(--a1);color:var(--txt)}
.btn.primary{background:var(--a1);color:#1a1200;border-color:transparent;font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}

/* domain tabs */
.domain-tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel);border:var(--border);border-radius:var(--r);
  padding:6px;margin-bottom:16px}
.dtab{border:none;background:transparent;color:var(--txt-soft);border-radius:8px;padding:9px 16px;font-size:13.5px;
  cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px;transition:.15s;font-weight:500}
.dtab:hover{background:var(--hover);color:var(--txt)}
.dtab.on{background:var(--a1-soft);color:var(--a1);font-weight:700}
.dtab .ct{font-size:11.5px;color:var(--txt-dim);font-variant-numeric:tabular-nums}
.dtab.on .ct{color:var(--a1)}

/* layout */
.layout{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}}

/* controls */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1;min-width:220px}
.search input{width:100%;background:var(--panel);border:var(--border);border-radius:8px;
  padding:10px 12px 10px 36px;color:var(--txt);font-size:13.5px;font-family:inherit;outline:none}
.search input:focus{border-color:var(--a1)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:var(--border);background:var(--panel);color:var(--txt-dim);border-radius:8px;
  padding:8px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s;font-weight:500}
.chip:hover{color:var(--txt);border-color:var(--a1)}
.chip.on{background:var(--a1-soft);border-color:var(--a1);color:var(--a1);font-weight:700}

/* section head */
.sechead{margin:20px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sechead:first-child{margin-top:2px}
.sechead h2{margin:0;font-size:15px;font-weight:700}
.sechead .d{color:var(--txt-dim);font-size:12px}

/* list-head + rows */
.list-head{display:flex;align-items:center;gap:12px;padding:6px 16px;color:var(--txt-dim);font-size:11.5px;font-weight:600}
.list-head .col-status{width:20px;flex:none}
.list-head .col-title{flex:1}
.list-head .col-level{width:52px;flex:none;text-align:right}
.list{display:flex;flex-direction:column;background:var(--panel);border:var(--border);border-radius:var(--r);overflow:hidden}
.card{border-bottom:1px solid var(--panel-b)}
.card:last-child{border-bottom:none}
.card:hover{background:var(--hover)}
.qrow{display:flex;gap:12px;align-items:center;cursor:pointer;padding:13px 16px}
.qidx{flex:none;width:20px;display:flex;align-items:center;justify-content:center;color:var(--txt-dim);font-size:13px;position:relative}
.qidx .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--txt-dim);opacity:.5}
.card.done .qidx .dot{display:none}
.card.done .qidx::before{content:"✓";color:var(--ok);font-weight:800;font-size:13px}
.q{flex:1;font-weight:500;font-size:14px;min-width:0}
.q .qtext{display:block}
.meta{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.tag{font-size:11px;color:var(--txt-dim);background:var(--hover);border-radius:6px;padding:2px 8px;cursor:pointer}
.tag:hover{color:var(--txt);background:var(--a1-soft)}
.lv{flex:none;width:52px;text-align:right;font-size:12.5px;font-weight:600}
.lv.入门{color:var(--easy)}
.lv.进阶{color:var(--med)}
.lv.深入{color:var(--hard)}
.chev{flex:none;color:var(--txt-dim);transition:.22s;font-size:12px}
.card.open .chev{transform:rotate(180deg)}
.ans{max-height:0;overflow:hidden;transition:max-height .3s ease,opacity .25s;opacity:0}
.card.open .ans{max-height:1400px;opacity:1}
.ans-in{margin:0 16px 14px;padding:14px 16px;border-radius:8px;border-left:3px solid var(--a1);
  background:var(--a1-soft);color:var(--txt-soft);font-size:13.5px;white-space:pre-wrap}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini{border:var(--border);background:transparent;color:var(--txt-dim);border-radius:6px;
  padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
.mini:hover{color:var(--txt);border-color:var(--a1)}
.mini.ok{color:var(--ok);border-color:var(--ok)}
mark{background:var(--med-soft);color:inherit;border-radius:3px;padding:0 2px}
.empty{text-align:center;color:var(--txt-dim);padding:60px 20px;background:var(--panel);border:var(--border);border-radius:var(--r)}

/* sidebar */
.side-col{display:flex;flex-direction:column;gap:14px;position:sticky;top:20px}
@media(max-width:900px){.side-col{position:static}}
.panel{background:var(--panel);border:var(--border);border-radius:var(--r);padding:16px}
.panel h3{margin:0 0 14px;font-size:12.5px;font-weight:700;color:var(--txt)}
.ring-wrap{position:relative;width:150px;height:150px;margin:0 auto}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-label b{font-size:24px;font-weight:800}
.ring-label span{font-size:11px;color:var(--txt-dim);margin-top:2px}
.ring-legend{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.ring-legend .row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.ring-legend .dot{width:8px;height:8px;border-radius:50%;flex:none}
.ring-legend .name{color:var(--txt-soft);flex:1}
.ring-legend .val{color:var(--txt-dim);font-variant-numeric:tabular-nums;font-size:12px}
.domain-stat{margin-bottom:12px}
.domain-stat:last-child{margin-bottom:0}
.domain-stat .row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.domain-stat .row .name{color:var(--txt-soft);font-weight:500}
.domain-stat .row .val{color:var(--txt-dim);font-variant-numeric:tabular-nums}
.domain-stat .bar{height:6px;border-radius:99px;background:var(--hover);overflow:hidden}
.domain-stat .bar i{display:block;height:100%;border-radius:99px;background:var(--a1);width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.tips-panel ul{margin:0 0 14px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--txt-dim)}
.btn.full{width:100%;justify-content:center;display:flex}

/* flashcard modal */
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:20px;
  background:rgba(20,22,26,.6);backdrop-filter:blur(4px)}
.modal.on{display:grid}
.fc{width:min(680px,100%);background:var(--bg2);border:var(--border);border-radius:14px;padding:26px;box-shadow:var(--shadow)}
.fc .hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--txt-dim);margin-bottom:14px}
.fc .qq{font-size:18px;font-weight:600;min-height:70px}
.fc .aa{margin-top:16px;padding:16px;border-radius:8px;background:var(--a1-soft);border-left:3px solid var(--a1);
  color:var(--txt-soft);white-space:pre-wrap;font-size:14px;display:none}
.fc .aa.on{display:block}
.fc .ft{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:flex-end}
kbd{background:var(--hover);border:1px solid var(--panel-b);border-radius:5px;padding:1px 6px;font-size:11px;font-family:Outfit,monospace}
footer{margin-top:30px;text-align:center;color:var(--txt-dim);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="logo">📚</span>
      <div>
        <h1>电商 / 生服 / 广告 新人问答库</h1>
        <p>基于《交易域白皮书》《数据域白皮书》及内部公开的生活服务、商业化广告知识整理，227 道问答，按领域分区，点击题目看答案，进度自动保存在本机。</p>
      </div>
    </div>
    <div class="tools">
      <button class="btn" id="themeBtn">🌙 深色</button>
      <button class="btn" id="expandBtn">展开全部</button>
      <button class="btn primary" id="fcBtn">⚡ 闪卡自测</button>
    </div>
  </header>

  <nav class="domain-tabs" id="domainTabs"></nav>

  <div class="layout">
    <main>
      <div class="controls">
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" placeholder="搜索问题、答案、标签……（按 / 聚焦）" autocomplete="off"/>
        </div>
        <div class="chips" id="lvChips">
          <button class="chip on" data-lv="全部">全部难度</button>
          <button class="chip" data-lv="入门">入门</button>
          <button class="chip" data-lv="进阶">进阶</button>
          <button class="chip" data-lv="深入">深入</button>
          <button class="chip" data-lv="未掌握">仅未掌握</button>
        </div>
      </div>
      <div id="content"></div>
    </main>

    <aside class="side-col">
      <div class="panel">
        <h3>整体学习进度</h3>
        <div class="ring-wrap">
          <svg viewBox="0 0 120 120" id="ringSvg"></svg>
          <div class="ring-label"><b id="ringPct">0%</b><span id="ringCt">0 / 0</span></div>
        </div>
        <div class="ring-legend" id="ringLegend"></div>
      </div>
      <div class="panel">
        <h3>领域完成情况</h3>
        <div id="domainStats"></div>
      </div>
      <div class="panel tips-panel">
        <h3>使用提示</h3>
        <ul>
          <li><kbd>/</kbd> 聚焦搜索框</li>
          <li><kbd>F</kbd> 打开闪卡自测</li>
          <li>闪卡内 <kbd>空格</kbd> 翻面 · <kbd>→</kbd> 下一题</li>
        </ul>
        <button class="btn full" id="resetBtn">重置学习进度</button>
      </div>
    </aside>
  </div>

  <footer>整理于 2026-09-06 · 内部学习自用，请勿外传 · 数据全部内嵌，可离线打开</footer>
</div>

<div class="modal" id="modal">
  <div class="fc">
    <div class="hd"><span id="fcMeta"></span><span id="fcPos"></span></div>
    <div class="qq" id="fcQ"></div>
    <div class="aa" id="fcA"></div>
    <div class="ft">
      <button class="btn" id="fcFlip">翻面 <kbd>空格</kbd></button>
      <button class="btn" id="fcKnow">✓ 标记已掌握</button>
      <button class="btn primary" id="fcNext">下一题 <kbd>→</kbd></button>
      <button class="btn" id="fcClose">关闭 <kbd>Esc</kbd></button>
    </div>
  </div>
</div>

<script>
const DOMAINS = [{"key": "trade", "name": "电商 · 交易域", "icon": "🛒", "desc": "围绕人、货、场的交易链路与订单全生命周期，讲清提单、购物车、下单支付、订单中心、交易流程引擎、中台开放与稳定性治理。", "items": [{"id": "trade-0", "q": "交易的本质是什么？包含哪三个基本元素？", "a": "商业的本质是价值交换，俗称“交易”，交易的成本决定了商业的效率。交易本质是一次需求和供给的交换关系，是一系列动态的业务流程。其核心抽象是三个基本元素：人、货、场。", "level": "入门", "tags": ["交易本质", "人货场"]}, {"id": "trade-1", "q": "零售商在人、货、场中扮演什么角色，其核心价值是什么？", "a": "零售商掌握了很多“场”，起着连接“货”与“人”的作用，并不直接生产商品。其核心价值是降低损耗、提升效率，提供有品质的商品和好的服务体验。", "level": "入门", "tags": ["零售", "场"]}, {"id": "trade-2", "q": "为什么说电商的崛起不仅仅是技术进步？", "a": "电商崛起的核心是对传统线下零售“场”的扩展，是交易效率的提升，以及不断满足消费者对于品质和体验的追求。技术进步只是支撑手段，效率与体验才是根本驱动力。", "level": "入门", "tags": ["电商本质", "交易效率"]}, {"id": "trade-3", "q": "订单在交易中的定位是什么？", "a": "订单是交易流程生成的一份单据，通常也被认为是一份交易合约，是交易相关数据的载体。一笔订单从创建到完结，构成了完整的订单生命周期。", "level": "入门", "tags": ["订单", "交易合约"]}, {"id": "trade-4", "q": "订单中心承载哪些能力？", "a": "订单中心承载完整的订单生命周期，主要包括三部分：\n- 订单数据模型的建设\n- 订单操作履约（订单支付、改地址、改价、发货、确认收货等）\n- 订单列表和详情页面的展示与渲染", "level": "入门", "tags": ["订单中心", "订单生命周期"]}, {"id": "trade-5", "q": "提单有哪几种主要形态？", "a": "文档列出了三种提单形态：\n- 立购：普通提单，多 SKU 情况下用户先选择 SKU，再进入提单页\n- 立购：一步提单，SKU 面板集成在提单页，比普通提单少一跳\n- 加购：多品提单，用户在购物车勾选多个 SKU 后进入提单页", "level": "入门", "tags": ["提单", "购买链路"]}, {"id": "trade-6", "q": "“一步提单”相比普通提单的核心差异是什么？", "a": "一步提单把 SKU 选择面板直接集成在了提单页中，用户不需要先在商详选完 SKU 再跳提单，因此比普通提单少了一跳，链路更短、转化更顺畅。", "level": "进阶", "tags": ["一步提单", "链路优化"]}, {"id": "trade-7", "q": "文档中提到了哪几类购物车形态？", "a": "购物车模块并非只有一种形态，文档列举了：购物车（大购）、即时零售购物车、以及 NM 独立购物车。不同业务形态对应不同的购物车实现与展示。", "level": "进阶", "tags": ["购物车", "业务形态"]}, {"id": "trade-8", "q": "下单与支付环节包含哪些关键路径？", "a": "主要包含三个模块及其入口路径：\n- 提交订单-下单：用户在提单页提交订单\n- 继续支付：从订单中心-订单详情进入\n- 支付成功页：付款成功后自动跳转", "level": "入门", "tags": ["下单", "支付"]}, {"id": "trade-9", "q": "支付成功页的产品价值是什么？", "a": "支付成功页在付款成功后自动跳转，一方面为用户清晰反馈当笔订单的交易结果，另一方面提供继续逛的出口和享受更多优惠的复购出口，兼顾体验确认与二次转化。", "level": "进阶", "tags": ["支付成功页", "复购"]}, {"id": "trade-10", "q": "订单管理包含哪些前台页面？", "a": "订单管理主要包含订单列表和订单详情页面（订单详情有多种版式），承载用户查看订单、进行继续支付、改地址、确认收货等售中售后操作的入口。", "level": "入门", "tags": ["订单管理", "订单详情"]}, {"id": "trade-11", "q": "抖音电商交易的业务/产品目标是什么？", "a": "业务/产品目标是“抖音电商要做好的交易”。什么是好的交易，主要从定性（用户体验）和定量（GMV）两个维度来衡量。", "level": "入门", "tags": ["业务目标", "好的交易"]}, {"id": "trade-12", "q": "抖音用户的心智和交易特点是什么？对交易提出了什么要求？", "a": "抖音用户以娱乐心智为主，新业务带来不确定感、冲动消费容易产生售后，同时音视频信息丰富。因此需要向用户提供尽可能全面、真实的商品信息和顺畅的交易体验，在坚定用户决策信心的同时，用更多决策信息避免冲动消费带来的售后。未来希望用户形成稳定的购买心智，来抖音除娱乐外还有购物目的。", "level": "进阶", "tags": ["用户心智", "交易体验"]}, {"id": "trade-13", "q": "定性维度上“好的交易”包含哪两方面诉求？", "a": "一是结合抖音丰富的音视频信息，提供全面真实的商品信息和顺畅的交易体验，减少冲动消费带来的售后；二是支撑更多业务类型，提升平台业务丰富度，满足用户多元化购物诉求，从而提升整体 GMV。", "level": "进阶", "tags": ["定性目标", "业务丰富度"]}, {"id": "trade-14", "q": "业务视角下 GMV 如何拆解？", "a": "业务视角的公式为：GMV = 渗透 UV × 转化率 × 客单价。三个因子分别对应用户规模、触达到购买的效率，以及平均单个消费者的消费金额。", "level": "入门", "tags": ["GMV", "指标拆解"]}, {"id": "trade-15", "q": "转化率的定义是什么？可以进一步细分为哪两类？", "a": "转化率指从消费者触达到消费者购买的效率，简单可定义为购买 UV / 曝光 UV。进一步可细分为：\n- 点击转化率：从曝光到商品详情的效率（可能经过多跳）\n- 购买转化率：从进入详情到最终购买的效率", "level": "入门", "tags": ["转化率", "漏斗"]}, {"id": "trade-16", "q": "GMV 拆解中 UV 与客单价分别代表什么？", "a": "UV 指用户规模，在相对固定的转化率和客单价下，用户规模增长就意味着 GMV 增长。客单价指平均单个消费者的消费金额，其影响因素包括单品价格、购买数量和复购率。", "level": "入门", "tags": ["UV", "客单价"]}, {"id": "trade-17", "q": "D-O 率的口径是什么？", "a": "D-O 率 = 闭环商详成单 UV / 商详展现 UV（含所有经过商详的）。它衡量的是从商品详情页到成单的转化效率，是交易侧的核心转化指标。", "level": "进阶", "tags": ["D-O率", "指标口径"]}, {"id": "trade-18", "q": "C-O 率的口径是什么？它与 D-O 率有什么区别？", "a": "C-O 率 = 成单 UV / 商品曝光点击 UV，起点是商品曝光的点击行为；而 D-O 率起点是商详页展现。两者分别刻画“点击到成单”和“商详到成单”的转化效率，观察漏斗的不同区段。", "level": "深入", "tags": ["C-O率", "转化漏斗"]}, {"id": "trade-19", "q": "客单价的指标口径是什么？", "a": "客单价指平均每个客户的支付金额，等于统计周期内的支付 GMV 除以支付客户数。", "level": "入门", "tags": ["客单价", "指标口径"]}, {"id": "trade-20", "q": "交易的技术目标是什么？", "a": "提供稳定可靠的交易服务，保障极致交易体验；建设和开放交易平台能力，提升业务效率；支持多行业交易场景，满足用户多元化购物诉求，最终提升 GMV。", "level": "入门", "tags": ["技术目标", "平台能力"]}, {"id": "trade-21", "q": "交易稳定性目标的量化要求是什么？", "a": "交易核心系统 SLA 要大于 99.99%，即全年交易不可用时间小于 52 分钟。这是交易稳定性的硬性底线要求。", "level": "进阶", "tags": ["SLA", "稳定性目标"]}, {"id": "trade-22", "q": "交易的容灾容错“1-5-15”指什么？", "a": "核心交易系统需具备容灾容错能力，面对系统故障和基础设施故障做到 1-5-15：1 分钟发现问题，5 分钟定位问题并执行预案，15 分钟完成止血和线上业务恢复。", "level": "进阶", "tags": ["容灾容错", "1-5-15"]}, {"id": "trade-23", "q": "交易稳定性除目标和容灾外还包含哪些维度？", "a": "还包括：\n- 性能和容量：核心交易系统支持高并发、大流量处理，核心接口低延时\n- 稳定性工具：核心交易系统可视化，包含监控大盘、业务可视化、系统可视化和技术管理", "level": "进阶", "tags": ["性能容量", "稳定性工具"]}, {"id": "trade-24", "q": "架构效率解决需求交付的哪几个层次？各自理想占比是多少？", "a": "架构效率把需求交付分为四个层次：\n- 配置化交付：理想状态 40% 以上\n- 低代码交付（工作流可视化管理、流程编排）：理想 20% 以上\n- 扩展开发（共建）：理想 20% 以上\n- 传统工程开发：理想 20% 以下\n即越往配置化、低代码方向迁移，交付效率越高。", "level": "深入", "tags": ["架构效率", "配置化"]}, {"id": "trade-25", "q": "交易基础体验指标包含哪些内容？", "a": "主要包含交易体验耗时与体验指标两块：耗时体验要对齐淘宝、拼多多，并持续做埋点和数据分析、数据精细化（场景拆分、用户分层等），服务端耗时按季度拆解目标优化，同时做前端渲染优化；体验指标包括交易 NPS、CCR、交易 CPO（尤其是归属技术 bug 的 CPO）。", "level": "进阶", "tags": ["体验指标", "耗时"]}, {"id": "trade-26", "q": "为什么交易体验指标是业务、产品、研发的共同评价指标？", "a": "因为交易 NPS、CCR、交易 CPO（尤其归属于技术 bug 的 CPO）直接反映用户在交易链路中的真实感受和问题量，文档明确这些体验指标是交易业务、产品、研发团队的主要工作评价指标，牵引三方共同为体验负责。", "level": "进阶", "tags": ["NPS", "CPO"]}, {"id": "trade-27", "q": "交易稳定性与质量指标分别有哪些？", "a": "稳定性指标主要是 SLA 和 MTTR（平均恢复时间）；质量指标主要是 fatal 数量、oncall 数量和技术 bug 数量。", "level": "入门", "tags": ["SLA", "MTTR"]}, {"id": "trade-28", "q": "交易研发效率用什么指标衡量？", "a": "主要通过业务需求吞吐率和研发交付率来衡量，反映团队在单位周期内承接与交付需求的能力。", "level": "入门", "tags": ["研发效率", "交付率"]}, {"id": "trade-29", "q": "交易架构能力包含哪些考察方向？", "a": "包含多个方向：\n- 性能指标、容量指标：核心服务 RT 优化与性能优化\n- 基础服务 SLA：核心服务 SLA 大于 4 个 9\n- 技术服务指标：核心系统文档产出并持续迭代、oncall 响应和服务\n- 交易模块化和配置化：平台模块化与配置化能力\n- 技术管理：技术运营平台和能力地图；交易链路与交易系统可视化", "level": "深入", "tags": ["架构能力", "可视化"]}, {"id": "trade-30", "q": "正向交易应用架构在实践中有哪些注意点？", "a": "应用架构一直在迭代中，架构图通常只画关键 PSM，还有一些旁路的、待下线的应用未包含在内；此外提下单目前采用 AGW 的 http 转 rpc 能力，省去了接入层的 api 应用。", "level": "深入", "tags": ["应用架构", "AGW"]}, {"id": "trade-31", "q": "提下单系统架构可以分为哪几层来理解？", "a": "文档从核心层架构与视图层架构两个层面描述提下单系统，核心层负责交易主流程与业务逻辑，视图层则通过组件化方案负责页面结构与渲染，二者通过标准化协议解耦。", "level": "进阶", "tags": ["提下单", "分层架构"]}, {"id": "trade-32", "q": "组件化整体架构由哪几部分组成？", "a": "由六部分组成：星河工作台、星河组件化管理模块、端 SDK、端动态化引擎、服务端 SDK、组件化协议。它们共同支撑提单等页面的可配置、可复用渲染。", "level": "进阶", "tags": ["组件化", "星河"]}, {"id": "trade-33", "q": "星河组件管理模块的职责是什么？", "a": "它是端渲染组件的管理中心，支持组件的创建、编辑、预览、发布能力，并为客户端/前端开发提供组件的复用、可视、可调能力。", "level": "进阶", "tags": ["星河", "组件管理"]}, {"id": "trade-34", "q": "星河工作台承担哪些能力？", "a": "星河工作台负责把客户端/前端组件的配置录入变为星河平台的组件，管理页面区块、区块与组件的绑定、组件与业务模型的绑定，负责端侧 SDK 冷发布的打包，并提供全新的客户端/前端/服务端、行业与平台的开发协作模式。", "level": "深入", "tags": ["星河工作台", "协作模式"]}, {"id": "trade-35", "q": "端/FE SDK 的核心能力有哪些？", "a": "端/FE SDK 负责协议解析与差量处理，与服务端 SDK 一起对业务屏蔽协议细节，主要能力包括：\n- 基础链路视图模型抽象（position）、单一数据流驱动渲染、差量上屏\n- 事件驱动执行，事件链支持异步组件、通用事件（router、linkage）、事件回放与自动埋点\n- 研发调试、环境绑定、hotReload 等\n- 用户交易核心链路稳定性监控（如白屏、下单阻塞核心事件）与性能 profile\n- 多端一致，支持业务无损降级 FE", "level": "深入", "tags": ["端SDK", "渲染"]}, {"id": "trade-36", "q": "端动态化引擎的方案特点是什么？", "a": "它是三端一致的视图绘制方案，可以理解为类似 v8 的引擎，但端侧不做自渲染，而是直接桥接到原生组件绘制；同时支持组件模板二进制，支持离线能力。", "level": "深入", "tags": ["动态化引擎", "三端一致"]}, {"id": "trade-37", "q": "服务端 SDK 在组件化中的作用是什么？", "a": "服务端 SDK 负责业务模型到组件化协议的配置转换，屏蔽协议细节；提供组件化协议到业务模型的通用回收机制并支持业务定制回收函数；同时沉淀服务端通用能力，实现通用能力与业务解耦。", "level": "深入", "tags": ["服务端SDK", "协议转换"]}, {"id": "trade-38", "q": "组件化协议要解决什么问题？", "a": "组件化协议对前后端交互的 viewmodel 层进行页面结构、展示数据的标准化描述，并对客户端/前端本地交互、端与服务端交互、埋点等进行标准化定义，核心目标是解决前后端业务逻辑与视图耦合的问题。", "level": "深入", "tags": ["组件化协议", "解耦"]}, {"id": "trade-39", "q": "交易流程引擎主要解决哪两个问题？", "a": "一是流程推进时的合法性校验，例如用户请求支付订单（未支付→已支付）时校验库存是否有效、订单优惠是否仍在生效期；用户要求改地址时校验主订单内是否已有子订单在仓库开始操作。二是流程推进后的数据推送和同步，例如支付完成的订单需推送到履约平台通知卖家开始履约（已支付→待发货）。", "level": "进阶", "tags": ["交易流程引擎", "状态流转"]}, {"id": "trade-40", "q": "交易流程引擎的五层结构是什么？", "a": "为解决合法性校验与数据同步问题，交易流程引擎实现了五层结构：\n- 流程 Process：针对不同业务场景可指定不同业务流程\n- 状态 Status adapter\n- 节点：动作 + 订单 PayStatus + 订单 Logistic status（履约状态）\n- 流转：节点推进时需要执行的流转，如创建订单、关闭订单、更新订单\n- 动作：定义每种流转下的动作序列", "level": "深入", "tags": ["五层结构", "流程引擎"]}, {"id": "trade-41", "q": "订单领域模型中有哪些订单粒度？", "a": "文档中出现的订单粒度包括拍下单、店铺单、SKU 单和 item 单。不同交易环节关联的粒度不同，模型通过状态驱动和模型关联把这些层级串起来。", "level": "进阶", "tags": ["订单模型", "订单粒度"]}, {"id": "trade-42", "q": "交易与支付的交互模型是怎样的？", "a": "交易-支付场景涉及的模型层级是拍下单、店铺单和 SKU 单，系统交互时机是用户支付。支付结果会驱动订单状态从未支付流转到已支付。", "level": "进阶", "tags": ["交易支付", "模型关联"]}, {"id": "trade-43", "q": "交易与履约的交互模型是怎样的？", "a": "交易-履约涉及店铺单和 item 单粒度，系统交互时机是支付后的履约收单和履约发货，即支付完成后把订单推送给履约平台，由卖家开始发货。", "level": "进阶", "tags": ["履约", "模型关联"]}, {"id": "trade-44", "q": "交易与售后的交互粒度如何确定？", "a": "交易-售后可能涉及店铺单、SKU 单或 item 单，具体取决于售后发起的粒度；系统交互时机为申请售后和售后状态更新。", "level": "进阶", "tags": ["售后", "粒度"]}, {"id": "trade-45", "q": "交易与商家侧、结算侧的交互分别是什么？", "a": "交易-商家涉及店铺单和 SKU 单，通过 Binlog 数据同步至商家侧；交易-结算涉及 SKU 单，交互时机是确认收货和订单关闭。", "level": "深入", "tags": ["商家侧", "结算"]}, {"id": "trade-46", "q": "稳定性治理的“五横三纵”是什么？", "a": "总体稳定性治理按照五横三纵展开：\n- 横向（五横）：预案&演练、业务正确性、性能&容量、架构治理、制度\n- 纵向（三纵）：事前、事中、事后\n落脚点是降低故障发生概率和提升故障处理效率。", "level": "进阶", "tags": ["五横三纵", "稳定性治理"]}, {"id": "trade-47", "q": "稳定性治理的两大落脚点是什么？", "a": "一是降低故障的发生概率，通过预案演练、业务正确性校验、性能容量建设、架构治理和制度约束把风险前置拦截；二是提升故障的处理效率，对应事中、事后的发现、定位、止血与复盘能力。", "level": "进阶", "tags": ["故障预防", "处理效率"]}, {"id": "trade-48", "q": "中台的“业务身份”是什么？由什么组成？", "a": "中台会为每个接入中台能力的业务方分配一个业务身份，相当于业务方的身份证。其组成为：业务身份 = biz + 认证机制 + 层级关系。", "level": "进阶", "tags": ["业务身份", "中台"]}, {"id": "trade-49", "q": "业务身份有哪些作用？", "a": "主要作用包括：\n- 识别身份：知道业务方是谁\n- 认证身份：校验身份是否正确、是否能调用某个能力\n- 隔离流程：通过业务身份绑定不同的扩展逻辑（扩展点），由中台运营平台配置规则决定走哪些逻辑\n- 隔离数据：不同业务身份间默认数据逻辑隔离，也可按业务维度分集群部署做物理隔离\n- 层级关系：身份支持父子关系，绑定的能力和流程可以继承", "level": "深入", "tags": ["业务身份", "隔离"]}, {"id": "trade-50", "q": "业务身份的层级继承关系怎么理解？", "a": "身份支持父子关系，例如“小店”“小店.EP”“小店.EP.视频课”构成层级链路，子身份可以继承父身份绑定的能力和流程；当子身份自己绑定了某个能力实现时则以自身为准，从而在复用通用流程的同时支持逐层定制。", "level": "深入", "tags": ["身份继承", "扩展"]}, {"id": "trade-51", "q": "业务身份如何支撑监控与稳定性保障？", "a": "交易大盘过去只能整体监控交易量趋势，小业务跌零难以及时发现，只能等客户投诉。把身份标识贯穿整个接口调用链路后，可在监控大盘按业务维度分组展现；稳定性上还可按业务维度做差异化 QoS，如按业务限流、建立性能基线并做劣化监控、梳理外部服务强弱依赖并制定预案开关、构建业务维度调用链路大盘。", "level": "深入", "tags": ["业务维度监控", "QoS"]}, {"id": "trade-52", "q": "中台技术运营平台是什么？提供哪些功能？", "a": "它是身份/能力/业务/扩展/网关等的一站式自助管理平台，支持多角色视角（平台方、能力方、业务方）。功能包括业务空间管理、平台管理、监控报警、IDL 管理、SDK 管理、能力管理、业务身份管理（注册/继承/token）、能力地图展示、业务身份与能力绑定启用、能力 SDK 接入，并支持业务身份的流程自定义和插件级（扩展点）开发。", "level": "深入", "tags": ["技术运营平台", "能力地图"]}, {"id": "trade-53", "q": "中台技术运营平台上三类角色的定位有何不同？", "a": "平台方是平台管理员，负责平台整体管理与监控报警；能力方是能力提供者，负责注册和管理能力、IDL 与 SDK；业务方是能力使用者，负责管理自己的业务流程和扩展逻辑，并完成身份与能力的绑定接入。", "level": "进阶", "tags": ["角色分工", "中台"]}, {"id": "trade-54", "q": "产品流程编排与原子能力管理包含哪几步？", "a": "主要包含三步：1）原子能力录入；2）产品流程编排；3）业务流程编排。即先把最细粒度的原子能力登记入库，再编排为产品流程，最后组合成面向具体业务的业务流程。", "level": "进阶", "tags": ["流程编排", "原子能力"]}, {"id": "trade-55", "q": "中台的开放方式有哪些？SPI 与扩展点如何配合？", "a": "开放方式为 SPI 开放 + 扩展点开放。通用处理流程代码放在中台系统，业务定制逻辑代码放在业务插件扩展包中，通过扩展点的注册、查找、执行机制完成通用逻辑与业务定制逻辑的隔离和整合。", "level": "深入", "tags": ["SPI", "扩展点"]}, {"id": "trade-56", "q": "扩展点的业务协作模式是怎样的？", "a": "中台对外提供的能力在标准流程之上留有扩展点，例如下单接口留出商品校验、库存校验两个扩展点；业务在自己的插件包里定制业务逻辑，中台系统启动时会扫描这些扩展包并完成扩展点注册，从而在不改中台主干代码的前提下实现业务定制。", "level": "深入", "tags": ["扩展点", "插件"]}, {"id": "trade-57", "q": "商业能力地图提出的背景是什么？", "a": "一是需求结构化以实现产研提效；二是电商中台能力开放的商业产品化和业务语义化。此前新业务接入需要中台各域分散拆解、多方对接，各领域业务特点和扩展方式不同，导致接入门槛高、理解成本大、对接效率低。", "level": "深入", "tags": ["商业能力地图", "产研提效"]}, {"id": "trade-58", "q": "需求结构化如何提升产研效率？", "a": "通过商业能力、业务活动、产品流程、原子能力四层抽象，把产品需求按能力层次拆解和结构化，需求迭代和产研架构迭代都按四层架构进行。这统一了产品之间、产品与研发、研发之间的沟通语言，便于全局掌握业务与系统情况、快速定位需求变更点和系统修改点，从而提升 PRD 产出效率与质量以及研发交付效率。", "level": "深入", "tags": ["需求结构化", "四层抽象"]}, {"id": "trade-59", "q": "什么是商业能力？业务视角和技术视角分别如何理解？", "a": "业务视角下，商业能力包含为达到特定业务目的而需要完成的一系列业务活动，可简单理解为电商中台沉淀下来的通用业务流程；技术视角下，是使用 SPI+API 设计、业务身份识别、模块化等技术，形成业务应用、业务服务、业务方法等不同粒度、可复用的业务代码。示例包括基础交易、预售交易、组合商品销售、周期购、通用营销优惠、基础售后、通用评价等。", "level": "深入", "tags": ["商业能力", "复用"]}, {"id": "trade-60", "q": "以“基础交易”为例，商业能力的分级定义是怎样的？", "a": "分为四级：\n- 0 级商业能力：基础交易\n- 1 级业务活动：提单页/下单，即交易中台面向用户（消费者）提供的提单页渲染、操作和下单能力\n- 2 级产品流程：提单页渲染（带 UI 页面）、提单页编辑（选择地址、更改购买件数、选择优惠券）、订单提交（订单校验、优惠使用、库存扣减、生成订单）\n- 3 级原子能力：上述流程中的关键原子节点，可通过节点编排组成产品流程", "level": "深入", "tags": ["商业能力分级", "基础交易"]}, {"id": "trade-61", "q": "按商业能力组织中台能力带来什么价值？", "a": "中台已有数百个系统、每个系统平均数十个能力，按商业能力（已沉淀的通用业务流程和业务活动）进行组织并以商业产品包方式沉淀（共建共享），可以把单纯的系统能力复用升级为商业能力和业务模式复用，降低业务中台接入成本、赋能新业务、帮助新业务产研提效。", "level": "深入", "tags": ["能力复用", "商业产品包"]}]}, {"key": "data", "name": "电商 · 数据域", "icon": "📊", "desc": "围绕采集、建设、管理、应用四层的电商大数据体系，讲清数据产品与BP、数仓分层与指标体系、埋点与实时数仓、数据治理与资产管理。", "items": [{"id": "data-0", "q": "数据的价值来自哪里？为什么需要数据体系？", "a": "数据的价值在于数据本身，但电商各业务域沉淀的零散原始数据很难直接产生价值。只有让数据被正确、合理地组织与透出，才能挖掘其中价值，真正形成决策依据并赋能业务。", "level": "入门", "tags": ["数据价值", "数据体系"]}, {"id": "data-1", "q": "电商数据技术体系围绕哪四个层面构建？", "a": "电商数据技术团队围绕电商数据资产，在采集、建设、管理、应用四个层面构建完整的数据技术体系，基于海量电商数据建立起整套大数据体系架构，打通数据驱动抖音电商持续增长的通路。", "level": "入门", "tags": ["采集建设管理应用", "大数据架构"]}, {"id": "data-2", "q": "电商大数据系统的建设思路是什么？", "a": "采用自底向上的思路：先建设数据采集与建设的整体基建，保证囊括所有电商数据，完成数据基建；再基于基建分层进行数据管理、构建基础服务能力；最后结合不同业务场景垂直提供数据应用能力（数据产品化、DA 能力、业务 BP 等）。为便于理解，白皮书叙述顺序则是自顶向下。", "level": "进阶", "tags": ["自底向上", "分层建设"]}, {"id": "data-3", "q": "数据采集层的主要数据来源和通路是什么？", "a": "数据采集层主要有两处数据来源：业务库数据采集和埋点数据采集，并分为实时与离线两条通路，把海量原始数据导入电商大数据体系。它是整套体系的输入源头，也是建设基础。", "level": "入门", "tags": ["数据采集", "埋点"]}, {"id": "data-4", "q": "数据建设层（计算层与存储层）的核心目标是什么？", "a": "面对海量数据，核心目标是建设高效的数据模型和体系，并对数据进行有序、有结构的分类组织和存储，避免重复建设和数据不一致性，保证数据规范；同时沉淀完整的数据建模方法论与关键技术能力。", "level": "进阶", "tags": ["数据建设", "建模方法论"]}, {"id": "data-5", "q": "数据管理层做什么？涉及哪些层次？", "a": "数据管理是广义的管理，同时涉及计算层、存储层、查询层与服务层。它建立在完善的数据建设之上，为让数据被合理使用，需要对数据资产进行充分管理，并通过应用数仓能力和工程技术能力，完成面向数据应用层的加工与消费。", "level": "进阶", "tags": ["数据管理", "数据资产"]}, {"id": "data-6", "q": "数据应用层通过哪三种方式让数据产生价值？", "a": "通过数据产品化把数据价值直观透出；通过 DA 分析能力把数据价值转化为战略决策；通过业务 BP 的方式把数据价值传递给各电商业务线，间接产生业务赋能。", "level": "入门", "tags": ["数据应用", "BP"]}, {"id": "data-7", "q": "数据产品的核心目标是什么？", "a": "数据产品是数据赋能业务的关键阵地。其核心目标是以数据驱动抖音电商持续增长，不断挖掘数据的价值并通过产品化的方式服务内部角色和外部生态。", "level": "入门", "tags": ["数据产品", "目标"]}, {"id": "data-8", "q": "商家数据产品服务哪些对象？核心是什么？", "a": "主要服务于外部生态，包括商家、达人、服务商，通过产品加服务的形式提供数据支持，例如头部商家的策略产品+专家服务、中小商家的诊断+学习中心。核心是量化平台价值并通过产品化方式规模透传（如经营方法论、泛商城价值），服务则把策略+优化的完整数据解决方案呈现给商达，使其更易理解。", "level": "进阶", "tags": ["商家数据产品", "外部生态"]}, {"id": "data-9", "q": "为什么商家数据产品需要分层建设？", "a": "不同层级商家对数据的理解和运用能力差异很大：品牌型商家销售渠道复杂、内部角色多、分析能力强，需要全渠道视角决策支持；腰部以下商家经营渠道和品类单一、数量庞大、分析能力较弱，核心诉求是解决电商经营问题，需要规模化产品方案帮助定位问题、挖掘机会。因此商家侧数据产品分为店铺版与品牌版建设。", "level": "进阶", "tags": ["商家分层", "产品策略"]}, {"id": "data-10", "q": "品牌型（超）头部商家的画像特征有哪些？", "a": "主要特征包括：数据能力和意识强；业务较复杂，电商仅为一个渠道，数据还包括线下等多来源；组织庞大、内部角色丰富，不同职能条线与层级诉求不同；关键人物较难触达影响，需要运营服务；老板更习惯直接阅读简明报告或用小程序等便捷看数；业务规模大，有投流习惯和大量预算。", "level": "深入", "tags": ["品牌商家", "用户画像"]}, {"id": "data-11", "q": "腰部与中小尾部商家的看数特征分别是什么？", "a": "腰部高意愿商家约 40% 有一定数据能力，会自行导出数据二次加工分析、可输出店铺运营选品营销策略，偏 PC 端；另有约 60% 依靠数据+经验指导经营，能结合平台指标做简单分析但不会深挖下钻，双端较均衡。中小尾部商家中约 15% 受经营场景限制只能用移动端（如珠宝文玩档口、二手兼职、农资绿植、厨具等），约 75% 数据能力较弱、看不懂复杂模块，偏好轻量级解决方案。", "level": "深入", "tags": ["商家画像", "移动端"]}, {"id": "data-12", "q": "罗盘-店铺版（经营版）的定位和服务角色是什么？", "a": "定位是支持商家在抖音电商经营诊断的数据平台，通过数据策略驱动商家成长；服务角色为商家的电商负责人、店长和电商运营。", "level": "入门", "tags": ["罗盘", "店铺版"]}, {"id": "data-13", "q": "罗盘-品牌版（策略版）的定位是什么？", "a": "定位是支持品牌/商家制定商品、内容、人群策略，从全渠道角度驱动生意增长；服务角色包括品牌的商品部、市场部、电商部以及核心决策层。针对影响品牌生意增长的人、货、场（内容为核心）三类抓手，提供三大策略引擎驱动增长。", "level": "进阶", "tags": ["品牌版", "策略引擎"]}, {"id": "data-14", "q": "达人侧数据产品要解决什么问题？", "a": "达人对用户的价值是发现并获得好物的来源，对商家的价值是商品售卖渠道，平台需要健康的达人生态。数据产品要把平台的价值导向量化地告诉达人：达人价值不仅是即时售卖，更多是通过优质内容帮商家种草，因此需要构建更全面的价值衡量体系评估种草+收割价值，并把这部分价值体现在商家与达人的撮合流程中，牵引达人多样化发展。", "level": "进阶", "tags": ["达人", "种草价值"]}, {"id": "data-15", "q": "罗盘-达人版的定位和服务角色？", "a": "定位是支持达人在抖音电商经营诊断的数据平台，促进抖音电商达人生态健康成长；服务角色为达人型作者和 MCN 机构。", "level": "入门", "tags": ["达人版", "罗盘"]}, {"id": "data-16", "q": "运营数据产品的定位是什么？", "a": "服务对象主要是电商内部角色，如业务运营、C 端产品。定位不仅是提高取数看数效率，更重要的是支撑运营的业务洞察和 C 端策略制定，通过量化方式合理评估业务状态，从而解决问题、发现增长机会。", "level": "进阶", "tags": ["运营数据产品", "业务洞察"]}, {"id": "data-17", "q": "产研数据产品承担什么职责？", "a": "承接内部数据信息化职责，把用户对平台的、用户对商家的、商家对平台的各类数据（行为数据、画像数据、工单数据、NPS 数据等）梳理整合，为各角色提供数据查询、分析、归因、预测等消费数据的能力，助力业务侧在数据梳理、开发、消费全流程提效。服务角色包括抖音电商产研、DA、战略、运营等。", "level": "进阶", "tags": ["产研数据产品", "归因预测"]}, {"id": "data-18", "q": "为什么要建立数据业务 BP 机制？", "a": "随着业务线增多、形态多样、组织庞大，数据中台支撑业务时出现新问题：业务发展快、信息不透明沟通不充分，导致业务与数据中台在 HC 预算、重点工作范畴、阶段性核心目标上预期不一致；不同业务该以什么方式支持、决策和执行难度不断提高。因此数据中台把数据 BP 业务支持机制化，明确每个业务的 BP 接口人，通过轻量级流程保证输出效率和产出结果。", "level": "进阶", "tags": ["业务BP", "机制化"]}, {"id": "data-19", "q": "业务 BP 的评价体系“0987”指什么？", "a": "这是数据中台沉淀的四个数字评价：\n- 数据稳定性：数据事故天数趋向于 0 天，通过 Healer 管理\n- 需求满足程度：需求满足率 90%，用 bits 管理并双月末统计\n- 数仓构建情况：分析师覆盖率 80%，看风神看板\n- 用户反馈：用户满意度 70%，通过调查问卷获取", "level": "进阶", "tags": ["0987", "评价体系"]}, {"id": "data-20", "q": "业务 BP 与业务方的协作模式如何建立？", "a": "围绕数据内容构建和服务，包括：明确协作模式（与业务接口人一起明确长期协作模式，并按业务定位和发展阶段定期 Review）；预期拉齐（针对重点项目优先级、人力投入拉齐预期，制定数据稳定性 SLA、业务需求满足率、业务满意度等目标）；需求评估及资源协调（调研业务痛点、主动挖掘数据需求、解析需求合理性和优先级、协调资源完成需求）。", "level": "进阶", "tags": ["协作模式", "预期拉齐"]}, {"id": "data-21", "q": "业务 BP 的日常工作方式有哪些？", "a": "以业务为单位，BP 接口人与业务接口人建立群组便于沟通；建立定期沟通机制，了解业务中长期重点，每双月对齐 OKR；BP 接口人还会参加业务方重点会议，深入了解业务并提供数据解决方案。", "level": "入门", "tags": ["工作方式", "OKR"]}, {"id": "data-22", "q": "业务 BP 承接需求的流程有哪些步骤？", "a": "通常有 7 个步骤：业务方在 meego 创建需求 → 找业务 BP POC 做需求评审 → 评审通过后数仓 RD 独立或与 DA 一起做数据探查 → 方案设计与设计评审 → 开发 → 测试并邀请业务方验收 → 上线及上线后任务的日常运维。过程中会借助 coral、dorado、manta、nuwa、healer、aeolus 等平台工具协同完成交付。", "level": "进阶", "tags": ["需求流程", "平台工具"]}, {"id": "data-23", "q": "业务 BP 的目标和五项能力要求是什么？", "a": "目标是打造稳定、可靠、易用的电商数据体系，建设电商业务场景下的数据解决方案。五项能力为：数据能力（建设指标体系，保障数据 SLA 与质量）、业务能力（洞察核心数据问题并给出解决方案）、工程能力（支撑离线、近线、在线数据需求）、合作能力（依托数据平台基建，联合分析师解决业务问题）、结果能力（判断预测需求业务价值，优先解决最核心问题）。", "level": "深入", "tags": ["BP职责", "能力模型"]}, {"id": "data-24", "q": "如何建设完善的电商数据指标体系（BP 视角）？", "a": "四个方面：基础数据，引入和建设业务需要的各方数据，以业务视角保障建设完整；指标体系，全链路梳理业务场景指标，全局视角、收口统一并形成管理规范；数据门户，合作建设门户沉淀数据资产、加强数据运营；数据易用，满足分析师消费效率，提升数据 SLA 和数据质量。", "level": "进阶", "tags": ["指标体系", "数据门户"]}, {"id": "data-25", "q": "电商数据业务 BP 有哪几个方向？", "a": "共 6 个方向，覆盖电商 8 个业务部门：泛商城&流量（服务用户产品部，含抖火头西四大端及流量分析）、抖音盒子、营销&联盟（服务市场及活动部、运营业务部，以大促营销为抓手提升撮合效率）、行业&策略（服务运营业务部和商家与平台部，跟进十几个行业方向）、治理&体验（服务平台治理部和体验与服务部）、物流&供应链（服务供应链与物流部门）。", "level": "进阶", "tags": ["BP架构", "业务方向"]}, {"id": "data-26", "q": "电商统一数据服务“领航者”是什么？", "a": "它是面向字节电商业务的一站式数据查询服务平台，通过集成多种数据源、自研 SQL 解析引擎实现跨数据源查询并提供统一查询接口，把过去需要人工定制开发接口的工作转换为平台通用能力，用户通过通用 DSL（SQL）自助完成数据查询。定位是屏蔽底层数据源复杂性，为上层数据产品提供统一便捷的数据服务出口，沉淀业务数据资产、形成数据集市。", "level": "进阶", "tags": ["领航者", "统一数据服务"]}, {"id": "data-27", "q": "领航者的两大核心服务分别做什么？", "a": "一是元数据配置中心，对外提供核心元数据的注册和管理能力，实现标准化的业务和数仓接入流程，让用户自助完成信息登记，解放数据服务人力、沉淀数据资产；二是查询引擎，采用典型计算引擎架构提供 SQL 查询能力，设立统一的查询请求与响应结构规范，具备通用计算层，提供高吞吐低时延的多数据源联邦查询能力，支持公司内主流数据源。", "level": "深入", "tags": ["元数据配置中心", "查询引擎"]}, {"id": "data-28", "q": "领航者元数据配置中心包含哪些模块？", "a": "包含：数据生产（面向数仓同学的数据库/表元信息注册管理与逻辑表建模能力）、查询服务（开放占位符、常用查询参数配置，沉淀固定模式查询，集成审批流和发布管理，实现 SQL 一键服务化）、数据集市（展示沉淀的业务数据模型、提供搜索并基于元数据展示血缘）、SDK（深度集成 GORM，提供对标 Mybatis 的体验）、基础组件（权限管理、版本控制及运维测试工具）。", "level": "深入", "tags": ["元数据", "SQL服务化"]}, {"id": "data-29", "q": "领航者查询引擎分为哪几层？", "a": "分为四部分：接入层对外暴露 RPC 接口，实现统一 Metric 埋点和查询日志收集到 BMQ；优化层提供符合语法规范的 SQL 解析校验、权限校验、SQL 重写、执行计划生成和 RBO 优化；执行层基于执行计划生成 DAG，提供基于内存的通用计算能力，支持常见表达式计算；插件层提供数据源和函数扩展接口，内置常用 UDF/UDAF，并针对不同数据源实现独立插件、支持不同程度的查询下推。", "level": "深入", "tags": ["查询引擎", "执行计划"]}, {"id": "data-30", "q": "DMP 是什么？在互联网语境下如何理解？", "a": "DMP 全称 Data Management Platform，广义上是数据管理平台，在互联网公司更多理解为 Digital Marketing Data Management Platform。Forrester 的解释是：把分散的第一、第二和第三方数据整合纳入统一技术平台，对数据标准化和细分，让用户把细分结果应用到现有互动渠道中以获得更好营销效果。理论上广告投放和营销相关数据都属 DMP 范围。", "level": "进阶", "tags": ["DMP", "数据管理平台"]}, {"id": "data-31", "q": "DMP 要解决什么核心问题？", "a": "DMP 的核心能力是为精细化营销或广告运营提供数据管理能力，是集数据采集、加工、整合、分析于一体的数据平台。例如在用户运营中整合各类业务数据，按用户粒度加工形成结构化数据并计算用户标签，精准描述用户画像特征，从而更好了解用户真实需求、提供差异化服务、实现精细化运营，提高用户留存和后续转化。", "level": "进阶", "tags": ["DMP", "用户画像"]}, {"id": "data-32", "q": "电商 DMP 为商家和运营提供哪些能力？", "a": "电商 DMP 为商家、运营提供海量标签，支持业务自行录入数据源，可自由组合标签快速圈定目标人群；同时提供精细化人群画像洞察，联动多渠道进行人群投放，并提供投放的后链路追踪如效果回收，闭环数据周期，助力全链路消费者运营。", "level": "进阶", "tags": ["标签", "人群圈选"]}, {"id": "data-33", "q": "DMP 的常见业务场景有哪些？", "a": "主要包括：\n- 精准营销：通过人群圈选、人群洞察针对用户特点做精细化运营，如营销新人券\n- 个性化推荐：为算法或模型提供标签数据做精确内容分发，如商品选品\n- 广告投放：为广告主提供人群定向，提升投放效果\n- 用户增长运营：通过用户画像分析为用户研究、用户运营提供数据支撑", "level": "入门", "tags": ["DMP场景", "精准营销"]}, {"id": "data-34", "q": "DMP 的核心能力包含哪些模块？", "a": "包括：数据资产管理（数据接入与生产，把数据标准化为标签数据）；标签模块（标签管理、运营与服务）；圈选能力（DMP 最重要的能力，基于标签和圈选规则生产人群包，需支持用户行为、交易记录、基本数据等多种类型数据）；洞察能力（对数据挖掘洞察并输出分析结果）；投放能力（人群包投放到千川、营销中台等多个平台）。", "level": "深入", "tags": ["圈选", "洞察投放"]}, {"id": "data-35", "q": "预警平台的目标和核心能力是什么？", "a": "目标是通过及时、准确的预警提高运营、产品和研发效率，不用时时盯着监控页面。核心能力包括：建设预警的平台化能力，方便产品化接入；在规则预警基础上增加算法预警能力；支持电商主要业务预警场景；增加电商事件管理模块，支持通过事件组合生成预警（如进入商详但未下单的比例）。", "level": "进阶", "tags": ["预警平台", "算法预警"]}, {"id": "data-36", "q": "诊断平台要解决什么问题？", "a": "很多业务诊断用逻辑分析树实现，即获取指标、按规则判断、走向下一个分析节点，如果都手写代码效率非常低。诊断平台希望可视化搭建逻辑分析树，自动执行并输出结果和中间过程，从而高效服务业务诊断。", "level": "进阶", "tags": ["诊断平台", "逻辑分析树"]}, {"id": "data-37", "q": "诊断引擎主要解决哪三个问题？", "a": "三个问题依次是：\n- 场景识别：碰到了什么问题，比如所处生命周期（成长不符合预期）、当前竞争力出问题或被挤占、想知道自身潜力和发力点\n- 归因拆解：问题发生在哪里、为什么发生\n- 推荐建议：我可以做什么、建议的效果如何\n模型建设上包含沉淀行业运营/策略运营/分析师经验的专家模型，以及探索时序算法、树模型和深度学习的算法模型。", "level": "深入", "tags": ["诊断引擎", "归因"]}, {"id": "data-38", "q": "数效平台要解决数据产品研发中的哪些痛点？", "a": "主要三类问题：重复开发（趋势图、排行榜等类似功能因数据返回格式不规范、组件沉淀不全面而重复开发，规范未统一导致大量个性化开发）；重复沟通（每次都要沟通查询方式、接口返回结果、UI 格式）；发布耗时（每次发布都要编译、打包、发布，单次十几分钟，既费时也不利于快速恢复）。", "level": "进阶", "tags": ["数效平台", "降本提效"]}, {"id": "data-39", "q": "数效平台的建设思路与技术方案是什么？", "a": "数效平台基于标准化输入提供具备组件化搭建产品能力的低代码平台，从三方面入手：提供一站式搭建应用能力；前后端组件化，可视化搭建页面和编排业务逻辑；配置化开发，提供热部署能力降低发布耗时。其核心分为平台（开发态，可理解为在线 IDE，用于搭建发布数据接口）和引擎（运行态，解析运行数据接口），同时依赖领航者提供标准化输入。使命是完成数据产品开发生态的降本提效。", "level": "深入", "tags": ["低代码", "数效平台"]}, {"id": "data-40", "q": "数效平台的典型开发流程是怎样的？", "a": "平台侧开发完接口后，元数据发布至 TOS，TOS 路径写入 TCC；引擎侧监听 TCC 变更，从 TOS 下载元数据，解析并加载至内存，从而实现配置化、热部署式的发布。", "level": "深入", "tags": ["开发流程", "热部署"]}, {"id": "data-41", "q": "应用数仓的定位和建设视角是什么？", "a": "应用数仓是基础数仓的上层开发，是直接面向业务产品的数据模型，具有高聚合、强分析的特点。电商应用数仓从角色、体裁、场景三个视角出发，共 12 个实体：经营角色覆盖商家、达人、服务商、机构；内容体裁包含直播、短视频、商城、搜索；业务场景涉及物流、营销、联盟、治理。它基于产品功能开发指标体系，逐步沉淀为主题域能力模型，支持产品快速迭代与共性拓展。", "level": "进阶", "tags": ["应用数仓", "能力模型"]}, {"id": "data-42", "q": "直播能力模型的建设重点是什么？", "a": "直播是抖音电商核心载体，模型覆盖直播前、中、后多环节完整数据，服务商家、达人、机构多视角。它涉及流量、交易、互动、售后、财经等业务域，并融合外部直播中台和广告商业化数据；通过与各业务 BP 互通共建沉淀罗盘公共中间层表、重构生产链路提升复用性，离线与实时数仓协同统一指标命名、口径和生产存储，沉淀指标口径文档，同时保障数据就绪 SLA 和数据质量。", "level": "深入", "tags": ["直播模型", "口径统一"]}, {"id": "data-43", "q": "商品（货品）能力模型提供哪些分析能力？", "a": "可从不同视角（商家、达人）分析货品，从不同渠道（直播、短视频、商品卡及下钻渠道）看带货情况，从交易、退款、售后、评价等域获取指标，并支持多维度下钻（SKU）和上卷（SPU 商品簇）。还提供品类行业下的聚合分析、榜单（用指数化屏蔽交易金额等敏感信息）、单品预测以及竞店竞品比对等进阶能力。", "level": "深入", "tags": ["商品模型", "下钻上卷"]}, {"id": "data-44", "q": "商品能力模型的建设思路是什么？", "a": "为收敛罗盘丰富指标的口径，按业务主题域建设中间层，包括交易、退款、售后、评价、流量等核心主题域并统一收敛；粒度上数据模型设计到用户粒度，以便更全面统计 PV/UV 等核心原子指标；维度上着重考虑商品、达人、渠道等，使模型可自由下钻和上卷，满足不同分析场景。", "level": "深入", "tags": ["主题域", "用户粒度"]}, {"id": "data-45", "q": "行业能力模型如何建设？", "a": "行业数据在建设中构建了订单、商品、商家、达人、内容、流量六个主题的应用层基础数据模型。思路是基于基础数仓建设不同粒度的汇总指标数据和全量维度表，关联形成涵盖六个主题所有指标的统计宽表，再基于分主题应用层模型针对各行业产品定制开发；以行业 360 数据模型为基础支持业绩管理、运营工作台等产品，收敛行业运营关注的核心指标。", "level": "深入", "tags": ["行业模型", "宽表"]}, {"id": "data-46", "q": "受众画像模型解决了什么问题，形成了什么能力？", "a": "人群是电商核心资产，受众画像分析是数仓建设重点，针对超大数据量级、维度爆炸等共性问题沉淀了一套可复用解决方案。目前已完成大促活动、商家、达人、商品、直播间相关人群画像资产建设，所有画像支持从人群基本属性、购买偏好、内容偏好等角度洞察数十种属性，并实现画像人群圈选与业务投放系统打通，在产品页面支持人群一键投放千川。", "level": "深入", "tags": ["受众画像", "人群投放"]}, {"id": "data-47", "q": "数据产品侧稳定性治理面临哪些挑战？", "a": "数据产品处于电商数仓末端，SLA 保障挑战多：上游依赖多且杂，会依赖财经、商业化、抖音、直播、算法等多个上游数仓，数仓间还交叉依赖，链路复杂冗长，开发人员意识认知参差，任何一个任务抖动都可能影响最终节点；平台稳定性与易用性问题会被逐层放大累积；流程健壮性方面需对任务、组件、事件建立并迭代合理性规则以逐步收敛体系问题。治理以问题为中心，从发现、预防、定位、止损几个角度制定方案，如建设任务治理看板。", "level": "深入", "tags": ["稳定性治理", "SLA"]}, {"id": "data-48", "q": "数据仓库的经典定义是什么？", "a": "数据仓库之父比尔·恩门（Bill Inmon）在 1991 年《建立数据仓库》一书中提出的定义被广泛接受：数据仓库是一个面向主题的、集成的、相对稳定的、反映历史变化的数据集合，用于支持管理决策。", "level": "入门", "tags": ["数据仓库", "定义"]}, {"id": "data-49", "q": "什么是数据域？划分时要注意什么？", "a": "数据域是面向业务系统中的业务过程或维度进行抽象的集合；业务过程可概括为一个个不可拆分的行为事件，在业务过程之下可以定义指标，维度是度量的环境（如买家下单事件中买家是维度）。数据域需要抽象提炼并长期维护更新，但不轻易变动；划分时既要涵盖当前所有业务需求，又能在新业务进入时无影响地被包含进已有数据域或扩展新数据域，同时确保数据唯一性，即一份数据只能有一个出处。", "level": "进阶", "tags": ["数据域", "唯一性"]}, {"id": "data-50", "q": "业务过程和应用主题分别指什么？", "a": "业务过程指企业的业务活动事件，如下单、支付、退款，注意业务过程是不可拆分的行为，通俗讲就是企业活动中的事件。应用主题是面向应用/分析场景的集合，侧重以分析实体为核心的数据应用场景整合，其涉及的数据往往横跨多个数据域。", "level": "进阶", "tags": ["业务过程", "应用主题"]}, {"id": "data-51", "q": "修饰类型、修饰词、时间周期分别是什么？", "a": "时间周期用来明确数据统计的时间范围或时间点，如最近 30 天、自然周、截至当日。修饰词指除统计维度以外对指标业务场景的限定抽象，隶属于某种修饰类型，如日志域访问终端类型下有 PC 端、无线端等修饰词；修饰类型是对修饰词的一种抽象划分，从属于某个业务域。", "level": "进阶", "tags": ["修饰词", "时间周期"]}, {"id": "data-52", "q": "维度与维度属性如何理解？", "a": "维度是度量的环境，用来反映业务的一类属性，这类属性的集合构成一个维度，也可称为实体对象，维度属于一个数据域，如地理维度（国家、地区、省、城市等级别）、时间维度（年、季、月、周、日等级别）。维度属性隶属于一个维度，如地理维度中的国家名称、国家 ID、省份名称等。", "level": "进阶", "tags": ["维度", "维度属性"]}, {"id": "data-53", "q": "原子指标的定义是什么？", "a": "原子指标和度量含义相同，是基于某一业务事件行为下的度量，是业务定义中不可再拆分的指标，是具有明确业务含义的名词。原子指标必须挂靠在某个业务过程下面，由业务过程+度量组成，例如支付用户数 = 支付（业务过程）+ 用户数（度量）。", "level": "进阶", "tags": ["原子指标", "度量"]}, {"id": "data-54", "q": "派生指标如何构成？与粒度是什么关系？", "a": "派生指标 = 一个原子指标 + 多个修饰词（可选）+ 时间周期，可理解为对原子指标业务统计范围的圈定。例如原子指标“支付金额”，“最近 1 天海外买家支付金额”即为派生指标（最近 1 天是时间周期，海外是修饰词，买家作为维度而非修饰词）。派生指标跟粒度无关，一个派生指标可以同时存在多个不同粒度，如全网粒度和商家粒度。", "level": "深入", "tags": ["派生指标", "粒度"]}, {"id": "data-55", "q": "数据仓库建设的核心原则有哪些？", "a": "主要包括：\n- 高内聚低耦合：业务相近相关、粒度相同的数据设计为一个模型，高概率同时访问的数据放一起\n- 数据可回滚：处理逻辑不变时，不同时间多次运行结果确定不变\n- 公共逻辑下沉：越底层公用的处理逻辑越应在调度依赖底层封装实现，避免公共逻辑多处存在\n- 规范一致性：相同含义字段在不同表中命名必须相同\n- 可扩展性：建立核心模型与扩展模型体系，扩展模型字段不过度侵入核心模型\n- 成本与性能平衡：适当冗余换取查询与刷新性能，但不宜过度冗余与复制", "level": "深入", "tags": ["建模原则", "高内聚低耦合"]}, {"id": "data-56", "q": "数据分层的意义是什么？", "a": "数据分层是一套体系方法，通过有效的数据组织和管理让数据体系更有序，意义包括：清晰数据结构，每层有各自作用域和职责，便于定位理解表；减少重复开发，通过通用中间层减少大量重复计算；统一数据口径，通过分层提供统一数据出口；复杂问题简单化，把复杂任务分解成多个步骤，每层解决特定问题。", "level": "入门", "tags": ["数据分层", "口径统一"]}, {"id": "data-57", "q": "数仓模型分层有哪几层？各层职责是什么？", "a": "自上而下为：\n- APP 应用数据层：提供差异化数据服务，满足业务需求，支持数据集、风神看板、数据产品、数据服务\n- DM 数据集市层：数据价值化沉淀，面向分析场景和数据产品，连接事实表与维度表形成冗余多维宽表，可加工高度汇总数据\n- DWM 汇总数据层：面向业务过程，封装业务规则（衍生计算），基于原子指标结合应用场景和时间周期沉淀常用衍生指标，统一口径、避免重复计算\n- DWD 明细数据层：面向业务实体，保持原有粒度，维度退化，逻辑下沉封装业务规则或轻度汇总，屏蔽业务变化\n- DIM 通用维度层：沉淀一致性维度，归一化维度属性口径，数据来源 ODS\n- ODS 基础数据层：贴源层，与业务系统同构，按策略保留历史数据，不直接暴露给应用", "level": "进阶", "tags": ["数仓分层", "ODS DWD DWM"]}, {"id": "data-58", "q": "电商有哪些主要数据域？请举例说明。", "a": "文档共列出 15 个数据域，例如：交易域（trade/trd，加购、创建订单、支付及取消订单、退货退款等）、流量域（flow/flw，埋点产生的流量信息与行为日志）、内容域（content/con）、用户域（user/usr）、商家域（seller/slr）、商品域（product/prd，上下架、发布修改、类目品牌 SKU/SPU）、联盟域（alc）、营销域（promote/prm）、治理域（gvn）、作者域（auth）、工具域（tls）、互动域（SNS）、公共域（pub）、财务域（fin）、物流供应链（logistics/lgt）。", "level": "进阶", "tags": ["数据域", "命名缩写"]}, {"id": "data-59", "q": "流量域和物流供应链域分别包含哪些内容？", "a": "流量域（flow/flw）包含通过埋点产生的各类流量信息、行为日志，如页面浏览、曝光、模块曝光、点击等。物流供应链域（logistics/lgt）包含订单履约的全生命周期节点，如常见的发、揽、派、签，以及生态伙伴的实体与关系数据，如商家、快递公司、关务、干线、仓公司等。", "level": "进阶", "tags": ["流量域", "物流域"]}, {"id": "data-60", "q": "电商指标的总体拆解逻辑是什么？", "a": "总体逻辑为：原子指标 + 修饰词【可选】 + 时间周期 = 衍生指标；衍生指标通过计算（四则运算或统计方法）生成复合指标，复合指标还可以继续组合。衍生指标和复合指标必须维护统计粒度。", "level": "进阶", "tags": ["指标拆解", "衍生指标"]}, {"id": "data-61", "q": "指标可以分为哪些类型？请结合示例说明。", "a": "按拆解结果与业务形态可分为原子指标、衍生指标、复合指标，类型上包括事务型、存量型、比例型、复合型（统计型/比例型/变化量型）。例如“支付金额”符合原子指标定义直接定义；“近 7 日支付金额”是原子指标+时间周期得到的衍生指标；“总入驻商户数”是入驻商户数+截止当日的存量型衍生指标；“近 7 日日均支付金额”是衍生指标+统计方法得到的复合指标。", "level": "深入", "tags": ["指标类型", "示例"]}, {"id": "data-62", "q": "比例型复合指标如何拆解？以支付 GPM 为例。", "a": "以“近 1 日直播间支付 GPM = 直播间支付金额×1000 / 直播间观看 PV”为例：分子由支付金额（原子指标）+直播间（修饰词）+近 1 日（时间周期）得到衍生指标；分母由直播间观看 PV（原子指标）+近 1 日（时间周期）得到衍生指标；再通过计算组合成复合指标。若在此基础上叠加最大值等统计方法，则得到统计型复合指标。", "level": "深入", "tags": ["GPM", "比例型指标"]}, {"id": "data-63", "q": "为什么不能构建“支付金额变化量”这样的指标？", "a": "因为变化量型复合指标必须先由原子指标+时间周期形成衍生指标，再叠加变化值统计方法，例如“近 7 日支付金额变化量”。缺少时间周期限定的“支付金额变化量”没有明确统计范围，不符合指标拆解规范，因此不可构建。", "level": "深入", "tags": ["指标规范", "变化量型"]}, {"id": "data-64", "q": "电商指标管理涉及哪些角色？各自职责是什么？", "a": "参与方包括需求团队、业务团队、数据 BP 团队和 Nuwa 团队。需求团队提出业务领域内需求；业务团队理解需求并拆分指标需求、与数据 BP 协同落地、负责指标变更和新增审核；数据 BP 分需求侧和基建侧，需求侧负责应用层指标规范化拆解、技术口径维护、录入与开发上线，基建侧负责原子指标口径收拢和公共层指标建设；Nuwa 团队支持各业务差异化管理流程的系统落地，并负责指标的血缘管理、变更管理、质量管理。", "level": "深入", "tags": ["指标管理", "Nuwa"]}, {"id": "data-65", "q": "原子指标与衍生/复合指标在建设层次上如何分工？", "a": "原则上原子指标收拢在基建 BP 在公共层建设，以统一口径；衍生指标和复合指标根据指标的公用性质，或提交公共层建设，或直接在应用层落地。这样既保证核心口径统一，又兼顾应用侧的灵活性。", "level": "深入", "tags": ["公共层", "应用层"]}, {"id": "data-66", "q": "什么是埋点？它的作用是什么？", "a": "埋点学名事件追踪（Event Tracking），是针对特定用户行为或业务过程进行捕获、处理和发送的相关技术及实施过程，是数据领域的专业术语和互联网俗称。埋点是产品数据分析的基础，一般用于推荐系统的反馈、用户行为的监控和分析、新功能或运营活动效果的统计分析等。", "level": "入门", "tags": ["埋点", "事件追踪"]}, {"id": "data-67", "q": "BTM 是什么？它的定位是什么？", "a": "BTM 全称字节全链路追踪模型（Bytedance Tracking Model），用于全方位描述埋点的位置及用户行为链路。它不只是一套埋点理论和规范，还与埋点全流程伙伴合作，从 SDK、埋点维护、埋点测试、埋点分析等方面围绕 BTM 共建了一整套研发工具集。", "level": "进阶", "tags": ["BTM", "埋点规范"]}, {"id": "data-68", "q": "BTM 的 A/B/C/D 四位分别代表什么？", "a": "BTM 的位置由四部分组成：\n- A 位（站点）：一个业务线，通常是一个 App 或网站\n- B 位（页面）：Web 端是一个页面，App 端是一个 screen\n- C 位（区块）：页面内特定功能的合集，一般由组件+控件组成\n- D 位（位置）：区块内具体的位置，埋点中一般代表事件发生的位置或控件", "level": "进阶", "tags": ["BTM", "ABCD"]}, {"id": "data-69", "q": "实时数仓是什么？", "a": "实时数仓由“实时”和“数仓”两个概念组合而成：“数仓”意味着建设过程需遵循数据仓库理念，“实时”意味着技术手段是实时计算即流式计算。概括来讲，就是基于流式计算技术和数据仓库理念，对无限数据流实施的数据建设方案。", "level": "入门", "tags": ["实时数仓", "流式计算"]}, {"id": "data-70", "q": "电商为什么需要实时数仓？", "a": "电商属于典型的运营型业务，注重精细化和时效性，高质量实时数据能为各类角色的精细化决策提供及时准确的信息支撑。对商家而言，时间意味着金钱，在直播带货场景尤为突出，实时业务监控数据能及时指导经营策略、发现更大生意机会；对内部运营而言，实时数据能为大促期间宏观战略调整和日常精细化运营提供实时分析洞察，从而提升平台 GMV。", "level": "进阶", "tags": ["实时数仓", "时效性"]}, {"id": "data-71", "q": "经典实时数仓架构由哪几部分组成？", "a": "分为采集、加工、应用三方面：采集通过 ByteIO 收集客户端日志、通过 Dbus 收集业务库 Binlog 数据；加工基于 Flink 和 Kafka（公司统一迁移到 BMQ）建设 ODS→DWD→DWS 三层数据；应用把加工层数据实时同步到在线存储，主要面向秒级到分钟级的实时大屏、预警等场景。", "level": "进阶", "tags": ["经典架构", "Flink"]}, {"id": "data-72", "q": "湖仓一体架构与经典实时数仓架构有什么区别？", "a": "两者采集方式相同（ByteIO 收客户端日志、Dbus 收 Binlog），差异在加工与应用：湖仓一体基于 Flink 和 Hudi 建设 ODS→DWD→DWS 三层；应用上一方面通过 PrestoSQL 等直查 Hudi，面向分钟级到小时级的准实时分析场景，另一方面通过增量计算+同步接入在线存储，面向小时级准实时服务场景。目前电商在湖仓一体上还处于初步落地阶段，其最终形态是流批一体架构。", "level": "深入", "tags": ["湖仓一体", "Hudi"]}, {"id": "data-73", "q": "实时数仓涉及哪些数据流采集与存储组件？", "a": "采集侧：ByteIO 是一站式的流量数据接入、采集、分流平台，电商客户端埋点和服务端埋点均通过它完成接入采集；Dbus 是 RDS 等数据库 Binlog 信息的接入采集工具，电商绝大部分业务库数据通过它接入。存储侧：BMQ 是完全兼容 Kafka 协议的云原生消息队列，作为经典实时数仓架构的数据流载体；ByteLake 是公司基于 Hudi 打造的数据湖存储方案，作为湖仓一体架构的流批统一存储。", "level": "深入", "tags": ["ByteIO", "Dbus BMQ"]}, {"id": "data-74", "q": "流式计算的定义与主要特性是什么？", "a": "定义是通过流式计算引擎对无限数据流做持续处理和计算，并提供低延迟、不断更新的数据结果。特性可从四个角度看：数据内容是无界数据，即动态增长变化、无明确分区和时间边界的数据流；处理方式是常驻持续的处理模式，计算的有序性和完整性很难保证，而批计算任务一次性完成；处理性能要求高吞吐低延迟；应用场景是实时决策，通过实时监控预警指导业务决策，而离线数据更多用于深度分析洞察。", "level": "深入", "tags": ["流式计算", "无界数据"]}, {"id": "data-75", "q": "实时数仓的核心技术点有哪些？", "a": "主要有两类：双流 Join 与维表 Join，主要应用于 DWD 层的预处理，如多源业务过程数据的拼接和扩维；窗口计算，主要应用于 DWS 层的指标计算，基于 checkpoint、event_time、watermark、early-fire 等特性和机制，做好数据完整性与时效性的平衡。", "level": "深入", "tags": ["双流Join", "窗口计算"]}, {"id": "data-76", "q": "实时数据查询应用中的 SP、AP、HSAP 分别指什么？", "a": "SP 即 Serving Processing，针对高并发服务场景（如各类实时大屏数据），主要选型 Abase、ES；AP 即 Analytical Processing，针对大规模复杂分析场景（如分析师实时看板和灵活分析），主要选型 ClickHouse、Doris，随着数据湖 OLAP 性能增强，AP 场景有望做到查存统一；HSAP 即 Hybrid Serving/Analytical Processing，同时满足 SP 和 AP 场景，解决异构存储带来的数据不一致和高运维成本问题。", "level": "深入", "tags": ["SP AP HSAP", "存储选型"]}, {"id": "data-77", "q": "数据治理的定义是什么？", "a": "数据治理有助于确保组织内数据资产正式管理的实践和流程，是对数据资产管理行使权力和控制的活动集合（规划、监控和执行），指导其他数据管理职能如何执行，在高层次上执行数据管理制度。它是组织为实现数据资产价值最大化所开展的一系列持续工作过程，明确数据相关方的责权、协调达成数据利益一致、促进采取联合数据行动。", "level": "进阶", "tags": ["数据治理", "定义"]}, {"id": "data-78", "q": "电商数据治理围绕哪几个方向？做了哪些工作？", "a": "基于字节电商业务特性建设数据仓库体系，围绕成本、质量、效率、安全四个方向展开，具体做了数据分层、数据域划分、基于维度建模的架构、命名规范，以及对需要共享的数据建立统一视图和集中管理等工作。", "level": "进阶", "tags": ["治理方向", "维度建模"]}, {"id": "data-79", "q": "数据治理要解决哪些痛点？", "a": "主要痛点包括：数据标准和规范不统一，业务和技术标准混乱、开发规范与交付标准不统一；数据质量差，缺乏有效统一的质量监控，如列值不准确不完整、同名维度或指标业务含义不一致、SLA 时效无法保障；业务知识体系散乱，研发人员对业务理解偏差大，增加开发人力成本；数据架构不合理，数据层分工不明显、缺乏一致的基础数据层、缺失统一维度和指标管理。最终表现为数据孤岛、复用率低、开发成本高。", "level": "进阶", "tags": ["治理痛点", "数据孤岛"]}, {"id": "data-80", "q": "数据治理的评价方式和策略是什么？", "a": "通过 5 大类 30 个指标来评价和衡量电商数据仓库的建设质量。治理策略的核心点是根据 80/20 原则选择重点，关注 ROI，把资源投入到收益最高的治理项上。", "level": "进阶", "tags": ["治理评价", "80/20"]}, {"id": "data-81", "q": "什么是元数据？分为哪两类？", "a": "元数据即数据的数据，包含技术元数据和业务元数据两个方面，打通了源数据、数据仓库和数据应用，记录了数据从产生到消费的全过程，主要记录数仓中模型的定义、各层级间的映射关系、监控数仓数据状态及 ETL 任务运行状态。在数仓系统中，元数据能帮助数据 BP 和治理同学方便找到关心的数据，指导数据管理和开发工作，提高效率。", "level": "进阶", "tags": ["元数据", "血缘"]}, {"id": "data-82", "q": "技术元数据具体包含哪些内容？", "a": "主要三类：数据本身的技术元数据，如表、列、分区信息，包括表名、分区信息、责任人、文件大小、表类型、生命周期，以及字段名、字段类型、字段备注、是否分区等；分布式计算系统运行元数据，如集群上所有作业运行信息（作业类型、实例名称、输入输出、SQL、运行参数、执行时间、最细粒度 Instance 执行信息）；数据质量和运维相关元数据，如任务监控运行日志、告警配置及运行日志、故障信息等。", "level": "深入", "tags": ["技术元数据", "作业信息"]}, {"id": "data-83", "q": "业务元数据的作用是什么？", "a": "业务元数据从业务角度描述数仓中的数据，提供介于使用者和实际系统之间的语义层，使不懂计算机技术的业务人员也能读懂数仓中的数据。它包括企业业务元数据（维度及属性、业务过程、指标等的规范化定义）和数据应用元数据（数据报表、数据产品等的配置和运行元数据）。", "level": "进阶", "tags": ["业务元数据", "语义层"]}, {"id": "data-84", "q": "数据存储管理的目标和手段是什么？", "a": "电商基于抖音短视频/直播的内容电商数据爆炸式增长，存储管理面临挑战，目标是有效降低存储资源消耗、节省存储成本。手段包括数据压缩、数据重分布、数据垃圾检测和清理、数据生命周期管理等。治理分为表、个人、项目、部门四个粒度，分数构成包括 TTL 设置、小文件、数据缺失、存储格式、特殊规则五类治理项。通过存储治理专项节省了大量资源，较好应对了业务快速增长与资源交付不及时的压力。", "level": "深入", "tags": ["存储治理", "TTL"]}, {"id": "data-85", "q": "数据计算管理从哪些方面进行优化？", "a": "对大数据集群 yarn 每天的计算资源消耗等进行管理、监控和优化，目标是降低计算资源消耗、提高任务执行性能、提升任务产出时间，一般从系统优化和任务优化两方面入手。具体包括队列 yarn 资源管理、任务倾斜优化、任务性能调优、无效作业治理、高负载大作业优化。", "level": "进阶", "tags": ["计算治理", "任务优化"]}, {"id": "data-86", "q": "数据质量管理包含哪五个维度？", "a": "包含唯一性、完整性、准确性、一致性、有效性，通过特定规则对这五个方面进行测试、检查、监控和告警：\n- 唯一性：不存在无意义的重复数据\n- 完整性：数据完整且连续\n- 一致性：数据在多数据源中意义一致\n- 有效性：数据在分析时间点是有效的，而非过期或失效数据\n- 准确性：数据合理、准确并符合数据类型标准\n电商数据 BP 团队通过 manta 配置 DQC 规则来解决日常监控问题。", "level": "进阶", "tags": ["数据质量", "DQC"]}, {"id": "data-87", "q": "数据安全管理包含哪些措施？", "a": "数据安全管理贯穿数据治理全过程，提供对隐私数据的加密、脱敏、模糊化处理、数据库授权监控等多种措施，全方位保障数据安全运作。实行数据安全分级管理，核心关注 L3 和 L4 的授权，以及离职转岗冗余权限回收；具体手段包括通用安全管理策略、敏感字段管理、安全扫描机制、数据安全大盘看板。", "level": "进阶", "tags": ["数据安全", "分级管理"]}, {"id": "data-88", "q": "数据运维如何保障数据体系平稳运转？", "a": "通过建立上线 SOP 规范流程减少因上线引起的数据事故，保障数据业务平稳运转、提升数据质量，力争建设更加标准化规范化的电商数据体系。具体机制包括上线流程 SOP、SLA 复盘机制、值班管理机制。", "level": "进阶", "tags": ["数据运维", "SOP"]}, {"id": "data-89", "q": "为什么数据治理要走向工具化？", "a": "随着治理工作越来越深入、落地的 SOP 规范越来越多，需要利用工具化/自动化手段形成常态化治理，不断提升治理效率和效果。具体方向包括上线检测、资源检测、代码规范检测、性能检测和上游系统变更感知。", "level": "进阶", "tags": ["治理工具化", "常态化"]}, {"id": "data-90", "q": "SLA 稳定性保障面临什么挑战？", "a": "电商数据线上任务数已经超过 1 万，支撑几十个业务应用，对 SLA 保障的挑战很大，需要通过一系列稳定性治理手段来保障 SLA，确保数据消费的及时性。", "level": "进阶", "tags": ["SLA", "稳定性"]}, {"id": "data-91", "q": "基于元数据的精细化数据资产管理分为哪几层？", "a": "分为四层：数据接入层，尽可能接入相关元数据，不仅包括存储相关元数据，也包括风神、nuwa、coral、dorado 等工具组件的元数据；元数据中间层，建设体系化元数据数仓，分为数据元数据（基础、计算、存储元数据）、规范元数据（模型、指标元数据）、服务元数据（表服务、api 服务元数据）；数据资产管理层；数据资产应用层。", "level": "深入", "tags": ["元数据分层", "资产管理"]}, {"id": "data-92", "q": "数据资产管理和资产应用具体做什么？", "a": "数据资产管理包含三块：资产分析（全域数据资产及资产目录，定期资产盘点，量化数据资产价值）、资产优化（从计算、存储、质量、模型、安全等方向做专项优化并沉淀方案，实现降本提效）、资产运营（通过建设的数据资产实现闭环运营，提升业务价值并有效衡量）。数据资产应用则是建立数据资产全景地图，支持多维数据资产分析、有效的数据成本管理，同时支持灵活的配置和权限管理。", "level": "深入", "tags": ["数据资产", "全景地图"]}]}, {"key": "localservice", "name": "生活服务", "icon": "📍", "desc": "围绕抖音生活服务的业务模式、角色生态、交易与履约链路、核心概念术语、指标口径、分析方法与常见易踩坑点整理的概念性问答，适合新人快速建立业务框架。", "items": [{"id": "localservice-0", "q": "一句话说明抖音生活服务（生服）是什么业务？", "a": "生活服务是把有线下门店/服务能力的商家（餐饮、休闲娱乐、丽人、酒旅等）以“线上店铺+商品”的方式呈现给抖音用户的平台型业务。\n- 用户在抖音刷到内容或搜索后线上下单，再到线下门店消费（到店）或由商家上门/配送（到家）。\n- 它区别于确定型消费的传统货架平台，本质是“内容种草驱动的兴趣消费”。", "level": "入门", "tags": ["生活服务", "业务模式", "兴趣消费"]}, {"id": "localservice-1", "q": "生服业务的核心业务模型可以怎样概括？", "a": "常见概括为“供给 → 内容 → 用户 → 交易履约”四段式。\n- 供给：商家入驻、门店（POI）建联、商品上架；\n- 内容：商家自播、达人探店短视频/直播、UGC 内容种草；\n- 用户：被内容或搜索触达后下单支付；\n- 履约：到店核销或到家配送，完成服务交付与结算分佣。", "level": "入门", "tags": ["业务模型", "内容闭环", "履约"]}, {"id": "localservice-2", "q": "什么是 POI？为什么说它是生服的核心实体？", "a": "POI（Point of Interest）指商家在地图上的一个经营点位，即线下门店。\n- 它既承载客观地理数据（名称、地址、电话），也是用户侧的展示容器（门店图片、服务介绍等）。\n- 生服的 POI 货架、POI 详情页、视频/直播间挂载门店锚点都围绕 POI 组织，所以它是流量分发与交易归属的关键实体。", "level": "入门", "tags": ["POI", "门店", "货架"]}, {"id": "localservice-3", "q": "POI 和 store/shop（店铺）是一回事吗？", "a": "不是。POI 是物理门店与展示容器；store/shop 是商家在平台上的经营实体，用于承载门店维度的经营信息与策略配置。\n- 同一个 POI 上如果同时经营到店团购和外卖配送，通常会被视为两个不同的 store。\n- 也存在没有线下 POI 的线上店铺形态（如航司卖票、部分到家业务）。", "level": "进阶", "tags": ["POI", "店铺", "经营实体"]}, {"id": "localservice-4", "q": "生服里的“团购”指什么？基本交易形态是怎样的？", "a": "团购是生服最核心的交易形态：商家把套餐或代金券以折扣价在线预售，用户“先买后到店核销”。\n- 用户购买后在“抖音-我的-订单”里拿到券码；\n- 到店出示券码，商家在来客 App/PC 端或 POS 扫码核销，权益才真正兑换完成。", "level": "入门", "tags": ["团购", "券码", "核销"]}, {"id": "localservice-5", "q": "生服常见的商品类型有哪些？", "a": "常见类型包括团购套餐券、代金券、次卡、预售券、预约/预订类商品、提货券、配送商品等。\n- 代金券：固定面额、折扣售卖，到店抵扣对应消费金额；\n- 次卡：把多次同类服务打包一次售卖、多次使用；\n- 预约/预订：如酒店、KTV 的“先买后约”，用户先购券再约时间到店。", "level": "进阶", "tags": ["商品类型", "次卡", "代金券"]}, {"id": "localservice-6", "q": "什么是核销？为什么核销才算真正履约？", "a": "核销是用户到店把已购券码兑换成实际服务的动作。\n- 支付只代表交易发生，服务尚未交付；核销才代表商家实际提供了服务、交易闭环完成。\n- 因此生服的“支付 GMV”和“核销 GMV”是两个完全不同的口径，评估商家真实经营时通常更看核销侧。", "level": "入门", "tags": ["核销", "履约", "口径"]}, {"id": "localservice-7", "q": "到店、到家、到综分别指什么？", "a": "到店与到家是两种履约方式：到店指用户去门店消费（团购核销为主）；到家指外卖、闪购等配送上门。\n- “到综”通常指到店综合行业，即除餐饮以外的休闲娱乐、丽人、运动健身、亲子等综合品类。\n- 到综行业分散、非标服务占比高、玩法多样，与餐饮的高标准化形成明显差异。", "level": "入门", "tags": ["到店", "到家", "到综"]}, {"id": "localservice-8", "q": "生服商品和电商商品的主要差异是什么？", "a": "- 卖家：生服以实体店主为主、线上运营能力参差，目标是线下引流；电商以专职运营团队为主。\n- 售卖内容：生服卖体验与服务，与“时间/空间”强绑定；电商多为实体商品，通过快递交付。\n- 闭环方式：生服需用户主动到店兑换才双向完成闭环，电商物流到家即单向完成。", "level": "进阶", "tags": ["生服商品", "电商对比", "履约差异"]}, {"id": "localservice-9", "q": "生服生态里有哪些核心角色？", "a": "主要包括平台、商家、用户、达人/MCN 机构、服务商、职人/店员、团长、骑手等。\n- 商家提供供给（商品与服务），达人与商家官号提供内容；\n- 服务商为商家提供代运营与营销解决方案；职人是商家的员工型内容创作者；\n- 平台负责流量分发、交易与履约基础设施、生态治理。", "level": "入门", "tags": ["角色生态", "服务商", "达人"]}, {"id": "localservice-10", "q": "服务商在生服体系里承担什么职责？", "a": "服务商是第三方公司，帮助商家把交易能力升级为长期经营能力。\n- 服务范围包括店铺运营、商品管理、内容制作、达人服务、直播代播、流量投放、培训等，也有全案代运营；\n- 服务商通常通过服务商平台与商家建立合作关系（挂接），并按合作模式参与分佣与业绩考核。", "level": "进阶", "tags": ["服务商", "代运营", "合作关系"]}, {"id": "localservice-11", "q": "达人探店在内容交易闭环里起什么作用？", "a": "达人探店是达人到门店拍摄短视频或直播，用内容把公域流量导向门店与团购商品。\n- 达人是内容核心生产方，连接商家的推广需求与用户的消费决策；\n- 达人业务本质是“撮合交易”：需求侧（商家/服务商）表达找达人的诉求，供给侧（达人）接单，平台撮合并在内容生产后结算分佣。", "level": "进阶", "tags": ["达人探店", "撮合", "内容闭环"]}, {"id": "localservice-12", "q": "什么是职人？和达人有什么区别？", "a": "职人一般指商家自己的员工或店员，以个人身份产出内容并带动门店成交。\n- 达人是外部创作者，通常通过佣金/保底费合作；职人属于商家内部渠道，更贴近门店真实服务场景。\n- 职人渠道的优点是成本低、可持续、复购与私域属性强，适合零售型与服务型门店长期经营。", "level": "进阶", "tags": ["职人", "达人", "商家自运营"]}, {"id": "localservice-13", "q": "商家在生服的经营链路大致有哪些环节？", "a": "典型链路是：入驻签约 → 门店（POI）建联 → 商品上架配置 → 内容与流量经营 → 交易 → 核销履约 → 结算与复盘。\n- 入驻阶段需提交主体、行业等资质并通过审核；\n- 经营阶段依赖“视频、自播、达播”三条内容腿获取流量；\n- 复盘阶段关注核销率、客单价、复购与投产等指标。", "level": "入门", "tags": ["经营链路", "入驻", "复盘"]}, {"id": "localservice-14", "q": "用户视角的下单到核销链路是怎样的？", "a": "用户在推荐/搜索/同城等场景刷到短视频或直播，点击 POI 或“小房子”组件进入商品详情页，提交订单并支付。\n- 支付成功后在“我的-订单”查看购买记录与券码；\n- 到店出示券码，商家扫码核销完成权益兑换；\n- 未消费的券在有效期内一般支持退款，退款也会影响 GMV 口径。", "level": "入门", "tags": ["用户链路", "小房子", "券码"]}, {"id": "localservice-15", "q": "扫码核销在系统层面大致经过哪些校验？", "a": "商家端扫码后，一般会做凭证可用性校验、券码与核销状态校验、商品与门店绑定关系校验（含适用门店范围）、账户与 POI 归属校验。\n- 任一环节不通过（如券已核销、门店不在适用范围、资质异常）都会导致核销被拒；\n- 因此排查核销失败时应从“券状态、门店适用范围、账户/POI 关系”三条线入手。", "level": "深入", "tags": ["核销链路", "校验", "排查"]}, {"id": "localservice-16", "q": "什么是 LBS 与同城场景？对生服有什么意义？", "a": "LBS 即基于地理位置的服务，本地生活按用户位置分发附近的商家与商品。\n- 同城页是抖音的本地流量分发场景，天然适配“附近可消费”的需求；\n- 由于生服供给与消费半径强绑定，位置匹配度直接影响转化率和核销率。", "level": "进阶", "tags": ["LBS", "同城", "流量分发"]}, {"id": "localservice-17", "q": "生服的“支付 GMV”通常怎么理解？", "a": "支付 GMV 指统计周期内支付成功的生活服务订单金额，反映交易的初始规模。\n- 口径上通常需同时满足支付成功、属于生活服务范围、剔除风控异常单等条件；\n- 不同看板对是否含外卖、是否剔除退款、是否含各类补贴的处理可能不同，取数前必须先确认口径。", "level": "进阶", "tags": ["支付GMV", "口径", "取数"]}, {"id": "localservice-18", "q": "核销 GMV 与支付 GMV 的核心差别是什么？", "a": "支付 GMV 按支付时间统计交易规模，核销 GMV 按履约（核销）时间统计实际消费金额。\n- 同一笔订单可能这个月支付、下个月核销，因此两个指标在同一时间窗内不可直接相减；\n- 核销 GMV 更贴近商家真实收入与平台变现基础，常用于业绩考核。", "level": "进阶", "tags": ["核销GMV", "时间口径", "指标"]}, {"id": "localservice-19", "q": "核销率怎么计算？为什么它是生服的关键健康度指标？", "a": "核销率通常用核销 GMV / 支付 GMV，或核销订单数 / 支付订单数计算。\n- 核销率低意味着大量已售券没被消费，可能引发退款、用户体验受损与商家复购意愿下降；\n- 它同时反映货品设计合理性、内容与人群匹配度、门店服务承接能力，是判断经营质量的核心指标。", "level": "进阶", "tags": ["核销率", "健康度", "分析"]}, {"id": "localservice-20", "q": "T+1 核销率与 T+7 核销率分别是什么意思？", "a": "T+1 核销率一般指当日支付成功且当日完成首次核销的订单占当日支付订单的比例；T+7 核销率指 T 日支付、在 T~T+6 日内完成首次核销的比例。\n- 两者刻画的是核销的时间分布与速度；\n- 短周期核销率高说明即时消费属性强（如现场扫码），长周期核销率反映计划型消费与券的沉淀情况。", "level": "深入", "tags": ["T+1", "T+7", "核销时效"]}, {"id": "localservice-21", "q": "分析不同渠道/载体的核销率差异有什么价值？", "a": "同一商家在直播、短视频、搜索、扫码等不同载体下的核销率往往差异明显。\n- 搜索等强意图渠道核销率通常更高，直播冲动下单的核销率相对更低；\n- 通过分渠道拆解，可以判断该增强哪类内容、哪类货品，或对低核销渠道调整券的门槛与有效期。", "level": "深入", "tags": ["渠道拆解", "核销率", "经营优化"]}, {"id": "localservice-22", "q": "生服里常见的券体系有哪些类型？", "a": "常见包括平台券、商家券、政府消费券、新人券、粉丝券、会员券等。\n- 不同券的成本承担方不同，会影响 GMV 各口径中“补贴金额”的计入方式；\n- 分析优惠效果时要区分“用户实付”“平台补贴”“商家优惠”，否则容易高估或低估真实成交规模。", "level": "进阶", "tags": ["券体系", "补贴", "口径"]}, {"id": "localservice-23", "q": "什么是标准商家与非标（渠道）商家？", "a": "按履约主体与售卖主体是否一致划分：一致的是标准商家，不一致的是非标/渠道商家。\n- 非标商家常见于商场、旅行社、演出票务、酒店代理、集团商家、航司等业态；\n- 非标模式下履约责任、结算路径与售后归属更复杂，是治理与体验问题的高发区。", "level": "深入", "tags": ["标准商家", "非标商家", "履约主体"]}, {"id": "localservice-24", "q": "商家入驻时的“资质”和“经营类目”是什么关系？", "a": "资质分主体资质、品牌资质、行业资质、商品/连锁资质等，用于证明经营合法性与能力。\n- 经营类目表达商家可经营的范围，由其提交的资质决定，可分主营类目与辅营类目；\n- 类目决定了可发布的商品类型与适用规则，所以资质不全会直接卡住商品上架。", "level": "进阶", "tags": ["资质", "经营类目", "入驻"]}, {"id": "localservice-25", "q": "什么是“建联”？为什么它重要？", "a": "建联指商家与 POI 建立关系的过程，一般包括认领关系与关联关系。\n- 只有建联成功，门店才能挂载商品、承接内容锚点与核销订单；\n- 连锁商家常涉及总户、区域户、门店户的层级关系，建联出错会导致数据归属和权限错乱。", "level": "深入", "tags": ["建联", "POI", "连锁"]}, {"id": "localservice-26", "q": "生服商品发布为什么被认为复杂？", "a": "因为商品信息是“类目 × 商品类型 × 玩法”的排列组合，行业极多、玩法多样。\n- 不同行业的表单在布局、校验规则、交互和文案上都有差异，又存在大量可复用项；\n- 因此平台通过商品属性与商品模板做标准化建模，以支撑差异化表单与下游一致消费。", "level": "深入", "tags": ["商品发布", "商品模板", "标准化"]}, {"id": "localservice-27", "q": "生服流量与商业化流量的关系是什么？", "a": "生服自然流量来自抖音站内内容分发（推荐、搜索、同城、POI 货架等），与商业化付费流量相区隔。\n- 商家可以用付费投放（如本地推）放大内容与门店曝光；\n- 健康的经营通常是自然内容打底、付费流量做放大，只靠投流容易导致成本高、可持续性差。", "level": "进阶", "tags": ["自然流量", "商业化流量", "放大"]}, {"id": "localservice-28", "q": "本地推与生活服务是什么关系？", "a": "本地推是面向本地门店商家的广告投放平台，围绕 POI 与来客体系，服务门店引流、团购成交与线索获取。\n- 它与生服的关系类似千川与抖音电商的关系：业务在前，投放平台为业务经营目标服务；\n- 优化目标更贴近到店消费、团购核销和线索留存。", "level": "进阶", "tags": ["本地推", "投放", "门店引流"]}, {"id": "localservice-29", "q": "生服商家常见的三条内容“腿”是什么？", "a": "通常指商家自播、短视频（含官号与职人）以及达人直播/达人短视频。\n- 三者互补：短视频沉淀内容资产与长尾流量，自播稳定日常转化，达播带来爆发与新客；\n- 只依赖单一内容形式的商家，流量与 GMV 稳定性通常更差。", "level": "进阶", "tags": ["内容矩阵", "自播", "达播"]}, {"id": "localservice-30", "q": "分析一个门店 GMV 下滑，可以怎么拆解？", "a": "建议先拆结构再找原因：\n- 按渠道/载体拆（直播、短视频、搜索、POI、扫码），定位是哪条流量线掉了；\n- 按“曝光→进入商详→下单→支付→核销”漏斗拆，看哪一环转化下降；\n- 再看货盘（是否缺爆款、价格带变化）、内容供给（视频/开播场次）、竞争与季节因素。", "level": "深入", "tags": ["归因分析", "漏斗", "GMV拆解"]}, {"id": "localservice-31", "q": "生服数据分析中常见的口径踩坑点有哪些？", "a": "- 混用支付 GMV 与核销 GMV，或跨时间窗直接相除得到失真的核销率；\n- 忽略“是否含外卖、是否剔除退款、是否剔除风控刷单、是否含补贴”的差异；\n- 不同看板/系统（商家端、内部看板、财务口径）本就存在口径差，跨系统对数前要先对齐定义；\n- 维度下钻时聚合口径变化，导致下钻汇总与大盘对不齐。", "level": "深入", "tags": ["口径对齐", "数据踩坑", "对数"]}, {"id": "localservice-32", "q": "为什么生服特别强调风控与刷单剔除？", "a": "因为团购券的交易与履约分离，存在虚假交易、批量刷单再退款等套利空间。\n- 业绩与激励类指标口径通常都会剔除命中风控规则的异常订单；\n- 若不剔除，会虚高 GMV 并压低真实核销率，导致策略判断失真。", "level": "深入", "tags": ["风控", "刷单", "指标质量"]}, {"id": "localservice-33", "q": "生服新人容易误解的概念有哪些？", "a": "- 以为“下单即完成交易”，忽略核销这一必要环节；\n- 把 POI 与店铺、商家总户与门店户混为一谈；\n- 认为生服等同于外卖或纯货架电商，忽视内容种草驱动的兴趣消费特征；\n- 忽略服务商、达人、职人等中间角色对业绩归属和数据可见范围的影响。", "level": "入门", "tags": ["常见误区", "概念辨析", "新人"]}]}, {"key": "ads", "name": "广告 · 商业化", "icon": "📣", "desc": "覆盖巨量引擎产品矩阵、广告投放链路、竞价与计费机制、定向与人群、归因与转化回传、效果评估指标以及投放常见问题排查的概念性问答。", "items": [{"id": "ads-0", "q": "巨量引擎是什么？在商业化体系里处于什么位置？", "a": "巨量引擎是字节跳动的营销服务品牌与广告投放中枢，整合抖音、今日头条、西瓜视频等产品的流量与投放能力。\n- 支持信息流、搜索、开屏等多种广告形式，提供 CPM/CPC/CPA/oCPC/oCPM 等多种计费方式；\n- 产品矩阵包含巨量广告（AD）、巨量千川、巨量本地推、巨量星图、巨量云图、DOU+、穿山甲等。", "level": "入门", "tags": ["巨量引擎", "产品矩阵", "投放中枢"]}, {"id": "ads-1", "q": "巨量广告（AD）、千川、本地推、DOU+ 的定位差异是什么？", "a": "- 巨量广告（AD）：综合投放平台，覆盖字节系全流量，目标多样（曝光、种草、线索、应用下载等）；\n- 巨量千川：抖音闭环电商专属广告平台，直连抖店，目标是成交与 ROI；\n- 巨量本地推：围绕 POI 的本地生活投放平台，目标是团购成交、门店引流与线索；\n- DOU+：低门槛的内容加热工具，偏自然流量与互动增长。", "level": "入门", "tags": ["平台对比", "千川", "本地推"]}, {"id": "ads-2", "q": "品牌广告和效果广告的本质区别是什么？", "a": "区别在广告主诉求与转化目标，而不在售卖方式。\n- 品牌广告追求曝光、认知与人群资产沉淀，优化目标偏浅层（展示、互动、有效看播、种草）；\n- 效果广告追求可衡量的转化，优化目标偏深层（表单、付费、成交、ROI）；\n- 合约与竞价只是售卖形式的差异：合约保量，竞价不保量。", "level": "入门", "tags": ["品牌广告", "效果广告", "优化目标"]}, {"id": "ads-3", "q": "CPT、GD 这类合约广告是什么？", "a": "CPT（Cost Per Time）是按时段买断的包时广告，固定位置必出，如开屏；GD（Guaranteed Delivery）是保量广告，承诺触达约定量级的用户。\n- 优点是曝光确定性强、适合品牌大声量场景；\n- 缺点是价格通常溢价较高、精准度和转化效率不如竞价广告，不适合中小商家做成交。", "level": "进阶", "tags": ["CPT", "GD", "合约广告"]}, {"id": "ads-4", "q": "CPM、CPC、CPA、CPS 分别按什么计费？", "a": "- CPM：按千次曝光计费，只看展示；\n- CPC：按每次点击计费，曝光不收费；\n- CPA：按转化行为（激活、表单、下单等）计费；\n- CPS：按实际销售额分成计费。\n从 CPM 到 CPS，广告主承担的风险依次降低，平台承担的风险依次升高。", "level": "入门", "tags": ["计费方式", "CPM", "CPA"]}, {"id": "ads-5", "q": "eCPM 是什么？为什么所有出价方式都要换算成 eCPM？", "a": "eCPM 是预估的千次展示收益，用来把不同出价方式换算到同一量纲后统一排序。\n- CPM 出价：eCPM = CPM_bid；CPC 出价：eCPM = CPC_bid × pCTR × 1000；CPA 类出价：eCPM = CPA_bid × pCTR × pCVR × 1000；\n- 平台按 eCPM 从高到低选择展示，从而在每次流量机会上最大化变现效率。", "level": "进阶", "tags": ["eCPM", "竞价排序", "出价换算"]}, {"id": "ads-6", "q": "oCPM 的含义、出价方式与计费点是什么？", "a": "oCPM 即优化千次展示成本，是“按转化出价、按展示计费”的智能出价方式。\n- 广告主只设定目标转化成本 CPA_bid，无需直接设千次展示价；\n- 平台用模型预估 pCTR、pCVR，换算为 eCPM = CPA_bid × pCTR × pCVR × 1000 参与竞价；\n- 计费发生在下发/展示环节，按实际曝光扣费。", "level": "进阶", "tags": ["oCPM", "转化出价", "计费点"]}, {"id": "ads-7", "q": "oCPC 和 oCPM 有什么区别？", "a": "两者都按转化出价、使用同一套转化预估模型，差别在计费点。\n- oCPC 在点击时计费，等价于把 CPA_bid 折算为 CPC = CPA_bid × pCVR；\n- oCPM 在展示/下发时计费，把 pCTR 和 pCVR 的预估风险都转移给广告主；\n- 从 CPA → oCPC → oCPM，平台风险递减、广告主风险递增。", "level": "进阶", "tags": ["oCPC", "oCPM", "风险分配"]}, {"id": "ads-8", "q": "为什么平台普遍采用 oCPM 而不是纯 CPA？", "a": "纯 CPA 下转化数据依赖广告主回传，广告主既当运动员又当裁判，可能少回传或不回传以“骗曝光”，平台承担大额损失。\n- oCPM 把计费点前移到展示/下发，平台不再依赖回传即可收费；\n- 同时广告主有动力回传真实转化，因为回传越准，模型预估的 pCVR 越高、竞价越有优势；\n- 扣费更平滑，也更利于流控、减少超投。", "level": "深入", "tags": ["oCPM动因", "数据回传", "超投"]}, {"id": "ads-9", "q": "什么条件下 CPA、oCPC、oCPM 的效果是等价的？", "a": "在广告主不作弊（如实回传转化）且平台的 pCTR、pCVR 预估足够准确时，三者的实际转化成本理论上一致。\n- 现实中预估必然有偏差，所以会出现超成本或平台亏损；\n- 这也是“计费比”等监控指标存在的原因。", "level": "深入", "tags": ["等价条件", "预估准确性", "超成本"]}, {"id": "ads-10", "q": "计费比是什么？大于 1 和小于 1 分别意味着什么？", "a": "计费比一般定义为广告主总付费 / 广告主价值（出价 × 实际转化数），理想值接近 1。\n- 大于 1 表示广告主实际成本高于其出价预期，即“超成本”，常见原因是 pCTR/pCVR 预估偏高；\n- 小于 1 表示广告主更划算、平台侧收益受损；\n- 因此计费比是评估出价与预估模型健康度的重要监控项。", "level": "深入", "tags": ["计费比", "超成本", "监控"]}, {"id": "ads-11", "q": "GFP、GSP、VCG 三种定价机制有什么差异？", "a": "- GFP（一价）：按自己的出价扣费，广告主会频繁试探调价；\n- GSP（二价）：按排在其后一名的出价（加最小单位）计费，广告主可放心报出可承受的最高价，无需频繁调价；\n- VCG：按获胜给其他参与者带来的“损失”计费，理论优雅但理解与解释成本高。\n业界主流竞价广告普遍使用 GSP。", "level": "深入", "tags": ["GSP", "定价机制", "博弈"]}, {"id": "ads-12", "q": "sorted_eCPM 里的 hidden_cost 是什么作用？", "a": "hidden_cost 是在纯商业收益之外，为用户体验与平台生态引入的控制项。\n- 排序常写作 sorted_eCPM = eCPM + hidden_cost；\n- 它会综合 dislike、举报、停留时长等负反馈信号，以及业务上的扶持或打压策略；\n- 目的是在短期收入与长期用户体验/生态健康之间取得平衡。", "level": "深入", "tags": ["hidden_cost", "排序", "用户体验"]}, {"id": "ads-13", "q": "一次广告请求大致会经历哪些主要阶段？", "a": "典型链路是：请求进入 → 召回（定向、频控、流控等多路召回） → 粗排（轻量模型大幅缩减候选） → 精排（预估 pCTR/pCVR 并校准） → 出价与排序（rank_bid、eCPM、hidden_cost） → 截断与混排 → 下发展示与计费。\n- 之后是曝光、点击、转化事件回流，进入日志与模型训练形成闭环。", "level": "深入", "tags": ["投放链路", "召回排序", "闭环"]}, {"id": "ads-14", "q": "什么是广告漏斗？各层级常看什么指标？", "a": "广告漏斗把效果拆成逐层递进的阶段：曝光 → 点击 → 转化 → 深度转化。\n- 曝光层看曝光量、CPM、展示频次；\n- 点击层看 CTR、CPC、完播率与负反馈；\n- 转化层看 CVR、转化成本（CPA）、ROI；\n- 深度层看付费率、复购、LTV 等长期价值指标。", "level": "入门", "tags": ["广告漏斗", "分层指标", "评估"]}, {"id": "ads-15", "q": "CTR、CVR、CPA、ROI 分别衡量什么？", "a": "- CTR = 点击 / 曝光，主要反映素材与创意的吸引力；\n- CVR = 转化 / 点击，反映落地页或直播间/商详的承接能力；\n- CPA = 消耗 / 转化数，衡量单个转化的获取成本；\n- ROI = 广告带来的成交金额 / 广告花费，是广告主最关心的投产指标。", "level": "入门", "tags": ["CTR", "CVR", "ROI"]}, {"id": "ads-16", "q": "ARPU 在广告分析中通常怎么用？", "a": "ARPU 指人均（或单位主体）带来的平均收入，在广告分析中常被拆到不同主体上使用。\n- 例如“广告 ARPU”看单条广告的平均收入、“素材 ARPU”看单个素材的平均产出；\n- 消耗波动分析常拆成“基建数量 × 单位 ARPU”，用来判断是供给不足还是跑量能力下降。", "level": "深入", "tags": ["ARPU", "消耗拆解", "分析方法"]}, {"id": "ads-17", "q": "广告主常用的出价产品目标有哪几类？", "a": "- 稳定成本（target cost）：控住成本的同时尽快跑量；\n- 最优成本（成本上限）：不超成本前提下最大跑量，接受更低成本、更均匀花费；\n- 最大转化数（nobid）：把预算花完并最大化转化数，适合快速验证素材；\n- ROI/深层目标出价：在守住 ROI 的前提下最大化跑量。", "level": "深入", "tags": ["出价产品", "nobid", "ROI出价"]}, {"id": "ads-18", "q": "ROI 目标出价（如 ROI2）的竞价逻辑与固定出价有何不同？", "a": "固定出价下 eCPM 由广告主给定的 CPA_bid 决定；ROI 目标出价下 eCPM 依赖广告主设定的 ROI 目标与预估的成交金额。\n- 大致形式为 eCPM ∝ pCTR × pCVR × 预估 GMV / ROI 目标；\n- 等价的近似转化成本可理解为客单价 / ROI 目标，客单价 = GMV 总和 / 转化数；\n- 因此客单价波动会直接影响实际可承受的转化成本与跑量能力。", "level": "深入", "tags": ["ROI出价", "客单价", "竞价"]}, {"id": "ads-19", "q": "巨量千川的定位和主要投放形式是什么？", "a": "千川是抖音闭环电商的垂直广告平台，直连抖店，服务直播与短视频两大内容场景以及货架场经营。\n- 常见形式包括短视频/图文推商品、直播推商品、推直播间等；\n- 推广方式上区分标准推广（精细化定向与优化目标）与全域推广（以直播间整体 ROI 为目标的托管式投放）。", "level": "进阶", "tags": ["千川", "电商广告", "投放形式"]}, {"id": "ads-20", "q": "全域推广与标准推广的核心差异是什么？", "a": "标准推广是有针对性地优化付费流量，可精细设置定向、出价与优化目标。\n- 全域推广不再区分付费与自然流量，统筹信息流推荐、直播广场、商城、搜索等全域流量，直接调控整体 ROI；\n- 优点是贴近商家真实经营目标、操作更省心；代价是可控颗粒度变粗，对素材与货品质量要求更高。", "level": "深入", "tags": ["全域推广", "标准推广", "ROI调控"]}, {"id": "ads-21", "q": "什么是内循环（闭环）广告？", "a": "内循环广告指由平台自身电商业务带来的广告收入，交易在站内闭环完成（如抖店支付）。\n- 千川即闭环电商的投放平台，广告主主要是店铺、达人与直播团队；\n- 与之相对的是非闭环/外循环广告，转化通常发生在广告主自有 App、网站或第三方平台。", "level": "进阶", "tags": ["内循环", "闭环电商", "收入结构"]}, {"id": "ads-22", "q": "内广和外广有什么区别？", "a": "内广是平台内部业务方用自有预算在广告平台买量，用于扶持商家、拉动业务 GMV，消耗计入业务经营成本。\n- 外广是广告主（商家）自己出钱的投放，属于真实外部收入；\n- 分析广告收入时通常要把赠款与内广等非售卖消耗剔除，才能得到“现金消耗”口径。", "level": "深入", "tags": ["内广", "外广", "现金消耗"]}, {"id": "ads-23", "q": "常见的广告形式有哪些，各自特点是什么？", "a": "- 信息流广告：夹在内容流中，原生性强，是当前最主流形式；\n- 搜索广告：用户主动搜索时触发，意图明确、精准度高；\n- 开屏广告：曝光量大、视觉冲击强，但打扰性也强；\n- 原生/软性广告：与内容高度融合，接受度高但制作成本更高。", "level": "入门", "tags": ["广告形式", "信息流", "搜索广告"]}, {"id": "ads-24", "q": "广告定向的主要类型有哪些？", "a": "- 基础定向：地域、性别、年龄等基础维度；\n- 行为兴趣定向：行为是已明确发生的高意向行为，兴趣是基于特征预估的高潜人群，通常取两者并集；\n- 达人相关定向：面向在特定达人直播间/内容下有互动或商品行为的人群；\n- DMP 人群包与智能定向：前者是自定义圈选人群，后者由系统自动探索最优人群。", "level": "进阶", "tags": ["定向", "行为兴趣", "智能定向"]}, {"id": "ads-25", "q": "DMP 人群包是什么？如何合理使用？", "a": "DMP 人群包是通过标签平台，用交集、并集、排除等方式把消费者标签、类目人群、粉丝人群等圈选组合成的可复用人群资产。\n- 冷启动期可用小而准的人群打基础、帮助模型收敛；\n- 模型稳定后应逐步放宽定向、扩大覆盖，否则人群饱和会导致 CPM 上涨、跑量困难。", "level": "深入", "tags": ["DMP", "人群资产", "定向策略"]}, {"id": "ads-26", "q": "定向设置的常见节奏建议是什么？", "a": "常见做法是分阶段推进：\n- 第一阶段用较精准的人群探索、打地基，验证素材与转化模型；\n- 第二阶段放大覆盖，选择类目相关的电商行为或兴趣匹配人群；\n- 第三阶段交给系统推荐/智能定向放量。\n关键是避免一开始就把定向叠得过窄，导致可竞价流量太少。", "level": "进阶", "tags": ["定向节奏", "冷启动", "放量"]}, {"id": "ads-27", "q": "什么是广告归因？为什么它是广告效果的基础？", "a": "归因是判断一次转化应归给哪一次广告触点的规则，决定了广告 GMV、转化数与 ROI 如何统计。\n- 常见规则是 last click（末次点击归因），即把转化归给最后一次点击的广告；\n- 归因口径不同会导致广告侧与业务/电商侧的 GMV 无法完全对齐，因此对数时必须先确认归因规则与时间窗。", "level": "深入", "tags": ["归因", "lastclick", "口径"]}, {"id": "ads-28", "q": "转化回传是什么？为什么广告主愿意回传？", "a": "转化回传是广告主把发生在自己侧的转化事件（下载、激活、注册、付费等）通过接口回传给广告平台。\n- 平台据此训练转化模型，更准确地找到高潜人群；\n- 回传越真实、越及时，pCVR 预估越准，广告主的竞价效率与转化成本通常越好；\n- 在闭环电商场景，转化数据天然在站内，无需广告主自行回传。", "level": "进阶", "tags": ["转化回传", "模型训练", "闭环"]}, {"id": "ads-29", "q": "RTA 是什么，适合什么样的广告主？", "a": "RTA（Realtime API）是广告主自建实时接口，在每次请求时由自己的程序决定是否对某个用户出价、以及出多少。\n- 它把广告主自有的一方数据（如存量用户、风控与价值分层）用于实时决策；\n- 适合预算规模大、数据与工程能力强的广告主，微小的 ROI 提升即可带来可观成本节约。", "level": "深入", "tags": ["RTA", "实时出价", "一方数据"]}, {"id": "ads-30", "q": "广告投放流程可以分成哪几个阶段？", "a": "通常分投前、投中、投后。\n- 投前：明确目标与考核指标，搭建账户结构、准备素材与落地页、设置定向与出价；\n- 投中：实时监控消耗、CTR/CVR、成本与 ROI，动态调预算出价、处理审核与异常；\n- 投后：复盘素材、人群、时段与货品表现，沉淀方法论与人群资产。", "level": "入门", "tags": ["投放流程", "投中优化", "复盘"]}, {"id": "ads-31", "q": "广告“不起量/掉量”常见原因有哪些？", "a": "- 基建不足：在投广告数或有效素材数下降，候选供给变少；\n- 竞争力不足：系统出价下降、pCTR/pCVR 下滑导致精排竞争力变弱；\n- 素材问题：素材疲劳、负反馈高、被频控过滤，或审核未通过/被拒；\n- 结构问题：账户或计划撞线、预算/出价设置不合理、短期内频繁暂停重启导致模型波动。", "level": "深入", "tags": ["掉量排查", "素材疲劳", "频控"]}, {"id": "ads-32", "q": "排查转化成本突然升高，可以按什么顺序做？", "a": "建议按漏斗自上而下定位：\n- 先看曝光与 CPM 是否异常（竞争加剧、大促、账户质量变化）；\n- 再看 CTR 是否下滑（素材疲劳、人群饱和、版位漂移）；\n- 再看 CVR 是否下滑（落地页异常、链路报错、商品/直播承接变差）；\n- 最后检查转化回传与监测链路是否出问题，避免“成本假高”。", "level": "深入", "tags": ["成本异常", "漏斗排查", "回传"]}, {"id": "ads-33", "q": "为什么会出现“转化数据看起来突然为零”这类问题？", "a": "常见原因并非投放效果本身，而是数据链路故障。\n- 回传接口或 SDK 异常、事件上报被中断；\n- 落地页/跳转链接失效、页面崩溃导致转化确实无法完成；\n- 统计口径或归因窗口变更、看板取数逻辑调整。\n处理时应先分渠道、分版本交叉验证，确认是效果问题还是数据问题。", "level": "深入", "tags": ["数据异常", "回传故障", "验证"]}, {"id": "ads-34", "q": "素材在效果广告里为什么如此关键？", "a": "素材直接决定 pCTR，并显著影响 pCVR，从而决定 eCPM 与跑量能力。\n- 素材数量不足会限制可竞价的候选组合，素材同质化会加速人群饱和；\n- 因此常用“素材矩阵”思路：多创意、多形式、多版位切片持续测试，并按 ARPU 等指标淘汰低效素材。", "level": "进阶", "tags": ["素材", "创意矩阵", "跑量"]}, {"id": "ads-35", "q": "广告审核对投放有什么影响？", "a": "素材与落地页需通过初审并接受后续巡检，未通过会导致计划无法起量或中途掉量。\n- 拒审率、审核状态是消耗波动分析中的常规检查项；\n- 遇到疑似审核问题应按平台指引优化素材或申请复审，而不是反复新建计划试探。", "level": "进阶", "tags": ["审核", "拒审", "合规"]}, {"id": "ads-36", "q": "评估广告增量价值时常用什么方法？", "a": "常用实验与对照方法，而不是简单看广告报表里的转化数。\n- A/B 测试或随机分流对照组，量化素材、人群、出价策略对结果的影响；\n- 投放期与非投放期的 AA 对比，拆分付费流量与自然流量的成交分布；\n- 目的是回答“这些成交是否本来也会发生”，避免把自然成交当成广告增量。", "level": "深入", "tags": ["增量", "AB测试", "对照"]}, {"id": "ads-37", "q": "广告新人常见的认知误区有哪些？", "a": "- 认为 oCPM 是“按转化付费”，忽略其计费点在展示；\n- 把 eCPM 当成实际扣费，忽略 GSP 二价与各类调控项；\n- 只盯单一指标（如只看 CTR 或只看 ROI），忽视漏斗整体与长期价值；\n- 忽略归因与统计口径差异，直接把广告报表数据与业务/财务数据相减对比。", "level": "入门", "tags": ["常见误区", "概念辨析", "新人"]}]}, {"key": "dataeval", "name": "数据评估 · 评分标尺", "icon": "📏", "desc": "面向“行为埋点→结构化序列→类目级总结”这条链路的质量评估方法论：资格项与一票否决、分层报分、A/B组评分维度与具体案例分析。", "items": [{"id": "dataeval-0", "q": "为什么这套评分标尺不用加权总分，而是要求先过资格项？", "a": "加权总分会让“格式漂亮但事实错误”的产出蒙混过关及格，这是这类评估任务最典型的失效模式。举例：若 A1 事实忠实性只打 1 分（存在动作类型误判），即使其他 11 个维度都是 5 分，加权平均仍可能远超及格线，但这份数据在生产环境中其实不可用——错误的支付记录会直接污染下游所有分析。因此标尺设置了“一票否决”机制：资格项不合格，其余维度不再计分，也不参与平均。", "level": "入门", "tags": ["评分方法论", "资格项"]}, {"id": "dataeval-1", "q": "三个“一票否决”资格项分别是什么？为什么偏偏是它们？", "a": "A1 事实忠实性 <3 分、B1 结论可溯源 <3 分、B6 合规安全 <4 分，任一命中即整体不通过，其余维度不再计分。\n- A1 把关“内容是不是真的”——如果连事实都能编造，后面做得再漂亮也没有意义；\n- B1 把关“结论有没有证据”——总结类产出最容易犯的错就是读起来头头是道但查无实据；\n- B6 把关“会不会捅出合规风险”——从购买行为反推健康状况、生育计划等敏感属性，这不是效果问题，是法律和信任问题，所以门槛设得比前两项更高（4 分而非 3 分）。", "level": "进阶", "tags": ["资格项", "合规安全"]}, {"id": "dataeval-2", "q": "“短板判定”是什么意思？为什么不能只看中位数？", "a": "通过资格项后，先取各维度打分的中位数作为整体档位，但同时要单独列出所有 ≤2 分的维度。\n举例：某份总结在 12 个维度里有 11 个都拿到 4 分，只有 B5“冷启动诚实度”是 1 分——中位数会显示 4 分，看起来“良好”，但这 1 分意味着这套系统在低活 / 零转化用户上会一本正经地编造画像，而这类用户恰恰占线上请求的大多数。所以“中位数 4 分”必须和“存在 1 分短板”一起报出来，二者缺一都会误导上线决策。", "level": "进阶", "tags": ["短板判定", "中位数"]}, {"id": "dataeval-3", "q": "为什么必须按用户活跃度分层报分，而不能只看全局均值？", "a": "高活用户（近 30 天有上百条行为、多次支付）天然信息丰富，模型在这类用户上表现好几乎是必然的，会拉高全局均值、掩盖真实问题。真正的风险水位在低活用户和零转化用户身上——他们的行为记录只有三五条，模型很容易在证据不足时“脑补”出一份看起来完整的画像。评估必须对高活 / 中活 / 低活 / 零转化四类用户分别报分、分别设及格线，而不能用一个平均数糊弄过去。", "level": "入门", "tags": ["分层报分", "评估方法论"]}, {"id": "dataeval-4", "q": "A 组和 B 组的评估方式为什么不一样？", "a": "A 组（行为序列文本化）是一个确定性任务——同样的原始埋点应该产出同样的结构化文本，可以用规则脚本做全量校验，再抽样人工复核细节。B 组（类目级总结）是一个生成式任务，同一份输入允许有不同但同样合理的表达，必须靠双人盲评来判断质量；LLM-as-judge 可以用来做初筛提效率，但必须先和人工标注做一致性校准，校准不过关时不能直接拿它的分数去做上线决策。", "level": "进阶", "tags": ["AB分组", "评估方法论"]}, {"id": "dataeval-5", "q": "A1“事实忠实性”具体怎么判定？给一个从 0 分到 5 分的案例对比", "a": "判定方法是随机抽 100 条记录，与原始埋点逐字段比对。\n- 0 分案例：序列里写“用户购买了某商品”，但支付表里根本没有这条记录——凭空捏造；\n- 1 分案例：没有捏造商品，但把“收藏”动作写成了“支付”，动作类型判断错误率超过 5%；\n- 2 分案例：动作类型全对，但价格取的是商品划线价而不是用了优惠券后的实付价——某件 599 元的商品实际支付 439 元，序列里却记了 599 元，下游做客单价分析时会系统性偏高；\n- 4~5 分：抽检零错误，且事实陈述与主观推断严格分开（不会在序列里夹带“用户很喜欢这款”之类的判断），5 分还要求每条记录能反查回原始日志主键。", "level": "深入", "tags": ["A1", "事实忠实性", "案例分析"]}, {"id": "dataeval-6", "q": "A2“完整性与去噪”想解决什么问题？举例说明“合并”和“丢失”的区别", "a": "这一维度平衡两件事：高价值动作（支付、加购）不能丢，低价值噪声（重复点击）不能堆成灾。\n案例：某用户对同一件商品在 7 天内点击了 7 次。如果原样罗列 7 条记录，序列会被大量重复点击淹没；如果简单去重合并成“浏览了商品 A”，又丢失了“7 天内 4 次”这个高意向信号。正确做法是合并表达为“7 天内 4 次浏览商品 A”——既压缩了噪声，又保留了强度信息。0 分是丢了支付记录这种硬伤，5 分则要求对被截断 / 省略的部分做显式声明，比如在文本里注明“另有 12 次同类目点击未展开”，让下游知道自己看到的是子集而非全集。", "level": "进阶", "tags": ["A2", "完整性", "案例分析"]}, {"id": "dataeval-7", "q": "A3“时序与时间信息”为什么强调“会话切分”？", "a": "没有时间信息的行为序列只是一个无序集合，无法回答“这是最近的兴趣还是三个月前的旧行为”。更进一步，即便有时间戳，如果不做会话切分，“用户当天连续浏览了 5 件商品”和“用户在一个月里陆续浏览了 5 件商品”会被写成同样的文本——但前者是一次集中比价决策，后者可能只是随手逛逛，业务含义完全不同。5 分档要求把转化路径显式连成链，比如“点击→当天加购→两天后支付”以及“点击→加购→至今未支付”，让读者一眼看出用户卡在了漏斗的哪一步。", "level": "进阶", "tags": ["A3", "时序", "案例分析"]}, {"id": "dataeval-8", "q": "A4“商品信息挂载准确性”里，为什么说“错挂比缺失更危险”？", "a": "商品名称和价格是埋点直采的，但类目通常需要额外关联一张类目表，这一步关联失败是最高频的静默故障，尤其在长尾商品（曝光量后 20%）上。如果关联失败时序列被静默挂到了默认类目（比如全部归到“其他”），下游总结会以为这个用户对“其他”类目感兴趣，这是一种会污染分析的错误信息；相比之下，如果明确标记为“类目未知”，至少下游知道这条数据不可用，不会被误用。5 分档还要求给出价格的类目内相对位置，比如“599 元，该类目价格带偏上”——因为 599 元在手机类目和零食类目的含义天差地别，孤立数字对模型来说信息量很低。", "level": "深入", "tags": ["A4", "商品信息", "案例分析"]}, {"id": "dataeval-9", "q": "A5“行为强度可辨性”和“漏斗停留状态”是什么关系？", "a": "点击、收藏、加购、支付本身是一条强度递增的阶梯。0 分档是把所有动作平铺成“用户看了 X”，点击和支付在文本里区分不出来。4 分档要求体现“停在半路”的状态——加购了但没支付、收藏了但没加购、看了评价但没点击——这些半途而废的状态恰恰是现有字段里信息量最高的部分：一个“加购未支付”的用户和一个“从未加购”的用户，营销策略应该完全不同，但如果文本化时把两者都简化成“未支付”，这个区别就丢失了。", "level": "深入", "tags": ["A5", "行为强度", "案例分析"]}, {"id": "dataeval-10", "q": "A6“格式稳定与可解析性”为什么对算法侧尤其重要？", "a": "A 组的下游是自动化管道，不是人在读，所以格式漂移的代价不是“不好看”，而是“静默丢数据”——解析脚本遇到意外格式要么报错中断，要么悄悄跳过这条记录，两种情况都会在你不知情的情况下损失样本。判定时会用固定解析脚本跑全量，统计解析失败率，还会把同一份输入重跑两次比对是否一致（同一输入两次输出不同，说明流程里有不确定性，这在生产管道里是不可接受的）。5 分档要求带 schema 版本号，变更可追溯，下游能按版本兼容而不是被一次改动打断。", "level": "进阶", "tags": ["A6", "格式稳定", "案例分析"]}, {"id": "dataeval-11", "q": "B1“结论可溯源”和 B2“区分度”分别在防什么？", "a": "B1 防的是“总结读起来头头是道，但查无实据”——每条结论都应该能指回具体的商品、动作和时间，5 分档还要求区分证据强度（3 次支付得出的结论 vs 1 次点击得出的结论，前者更可信，弱证据要标注为待验证）。B2 防的是另一种更隐蔽的问题：“总结彼此可以互换”——换一个用户，总结内容几乎不变，只是类目名字换了。检验 B2 最有效的方法是盲配对测试：把 5 份总结和 5 份对应的行为序列打乱，让标注者去配对，如果配对准确率接近随机，说明模型只是在套模板而不是在真正读数据。", "level": "深入", "tags": ["B1", "B2", "案例分析"]}, {"id": "dataeval-12", "q": "为什么说“同类目内不同用户的总结仍然不同”是最难的一档？", "a": "跨类目做区分相对容易——买母婴用品的用户和买数码产品的用户，总结自然不一样。真正难的是同一个类目内部：两个都买手机的用户，一个反复比价三款千元机、一个直接下单旗舰机，如果总结都写成“该用户对手机类目有较高兴趣”，那这份总结对排序和推荐毫无边际价值。5 分档要求即使限定在同一类目内，总结依然要能体现出这两个用户的差异，这才是个性化真正需要的颗粒度。", "level": "深入", "tags": ["B2", "区分度", "案例分析"]}, {"id": "dataeval-13", "q": "B3“可行动性”怎么判断一条结论“能不能用”？", "a": "判定标准很朴素：算法侧看完这条结论，知不知道下一步该做什么。“用户喜欢购物”是 0 分，没法转成任何线上信号；“偏好时尚风格”看似具体，其实现有字段（点击 / 收藏 / 加购 / 支付 / 评价 / 时长 / 名称 / 价格 / 类目）根本支撑不出“风格”这种判断，属于越界推断，也拿不到高分。3 分档“类目 + 价格带 + 转化倾向”可以直接用于召回和粗排过滤；5 分档要求给出负向约束——明确不该推什么、哪些类目已经饱和，这一点多数方案都做不到，因为大家习惯只产出正向偏好。", "level": "进阶", "tags": ["B3", "可行动性", "案例分析"]}, {"id": "dataeval-14", "q": "B4“时效分层”要解决的核心矛盾是什么？", "a": "长期偏好和当前购物意图是两种性质不同的信号，混在一起会污染实时召回。举例：一个用户半年前买过一台冰箱，这是长期大件、短期内不会复购；但如果同一个用户最近两周突然频繁浏览婴儿用品，这是一个新出现的、更紧迫的意图。如果总结把两者简单平均或并列呈现，实时推荐系统可能还在孜孜不倦地推冰箱周边。5 分档要求区分“一次性需求”与“持续偏好”——买一次大家电和反复购买零食，在下游的用法应该是相反的（前者不该继续推同类目，后者应该持续保留在候选池里）。", "level": "深入", "tags": ["B4", "时效分层", "案例分析"]}, {"id": "dataeval-15", "q": "B5“冷启动诚实度”为什么专门强调“证据不足时要老实说不知道”？", "a": "绝大多数评估方案在行为丰富的高活用户上表现都不错，问题出在只有两三次点击的用户身上——这类用户在大盘里往往占多数。0 分档是行为不足 3 条时仍然输出一份语气笃定的完整画像，这种“自信的胡说”比“沉默”危害更大，因为下游会当真去使用它。4 分档要求证据确实不足时明确输出“证据不足”而不是勉强生成，5 分档更进一步，把结论分成高置信、低置信推测、数据不足三层分别呈现，让下游可以按置信度区别对待，而不是眉毛胡子一把抓。", "level": "深入", "tags": ["B5", "冷启动", "案例分析"]}, {"id": "dataeval-16", "q": "B6“合规与安全”为什么是资格项，而且门槛比 A1、B1 更高？", "a": "因为从购买行为可以反推出大量敏感属性——买了大量药品和医疗器械，等价于间接暴露了健康状况；买了母婴用品，等价于暴露了生育计划。这一维的失败不是“效果不够好”的问题，是实打实的法律和信任风险，所以及格线设在 4 分而不是 3 分。1 分档特别值得注意：即使输出里没有出现“该用户可能患有某疾病”这种显式敏感标签，只要原文逐条列出了药品浏览记录，效果上等同于泄露了健康状况——脱敏不能只看有没有说敏感词，要看信息本身能不能被反推出来。4 分档要求有明确的敏感类目黑名单和拦截逻辑，而不是依赖模型自觉。", "level": "深入", "tags": ["B6", "合规安全", "案例分析"]}, {"id": "dataeval-17", "q": "测试集为什么要分层构建，八个分层各自在验证什么？", "a": "不分层的均分会掩盖问题——高活用户拉高整体分数，而线上大多数请求恰恰来自低活与零转化用户。建议的八个分层各有侧重：\n- 高活跃（>100 条行为）：重点看 A2 去噪、A6 长度控制是否失控；\n- 中活跃：作为整体基线水位；\n- 低活跃（3~10 条）：重点看 B5 冷启动诚实度；\n- 零转化（只有点击浏览）：重点看 B2 区分度、B3 可行动性——没有转化信号时模型是否还能说出有意义的话；\n- 单类目：验证 B2 里最难的一档，同类目内部的区分能力；\n- 跨类目：验证 B4 时效分层和偏好迁移；\n- 敏感类目：专门验证 B6 这个一票否决项；\n- 长尾商品：验证 A4 类目关联覆盖率。\n每一层都应该独立报分、独立设及格线，而不是混在一起算总分。", "level": "进阶", "tags": ["测试集分层", "评估方法论"]}, {"id": "dataeval-18", "q": "这套评分标尺本身评的是什么？它评不出什么？", "a": "这套标尺评的是“文本 / 总结写得好不好”——事实是否准确、结构是否完整、结论是否可追溯。它评不出“这份产出对下游业务有没有用”。因此必须同时跑一组下游对照实验：把 LLM 总结特征和现有的 ID 类特征放在一起，在实际推荐 / 召回链路上做增量对比。如果标尺打分很高，但下游对照实验显示几乎没有增量，说明这套标尺本身“评错了对象”——它衡量的是文本质量而非业务价值，两者需要分开验证，不能互相替代。", "level": "深入", "tags": ["对照组", "评估方法论"]}, {"id": "dataeval-19", "q": "为什么说“一条记录 = 一次商详页行为”这个粒度不够用？", "a": "这个粒度定义只适合支撑 A 组的商品级特征（比如某商品被点击了几次）。但 B 组总结真正需要的最小语义单位是“会话”（一次完整的购物任务）——比价（同一时间段内反复查看几款竞品）、反复回访（多次回到同一商品页但迟迟不下单）、加购后又转投另一款（先加购 A，又加购了同类的 B）这类信号，本质上只存在于多条记录之间的关系里，任何单条记录本身都表达不出来。如果数据管道只按单条记录组织，会话级别的这些高价值信号会在源头就被结构性地丢弃，不是靠后面加工能补回来的。", "level": "深入", "tags": ["数据粒度", "会话", "评估方法论"]}]}];
const ALL = DOMAINS.flatMap(d => d.items.map(it => ({...it, dk:d.key, dn:d.name})));
const LS = 'qa-onboarding-v1';
let done = new Set(JSON.parse(localStorage.getItem(LS) || '[]'));
let state = {dom:'all', lv:'全部', kw:''};
const save = () => localStorage.setItem(LS, JSON.stringify([...done]));
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hl = (s,kw) => kw ? esc(s).replace(new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`) : esc(s);
const LEVELS = ['入门','进阶','深入'];
const LV_COLOR = {'入门':'var(--easy)','进阶':'var(--med)','深入':'var(--hard)'};

/* ---------- overview ring + domain panel (sidebar) ---------- */
function renderStats(){
  const total = ALL.length, doneN = ALL.filter(i=>done.has(i.id)).length;
  const pct = total ? Math.round(doneN/total*100) : 0;
  document.getElementById('ringPct').textContent = pct + '%';
  document.getElementById('ringCt').textContent = `${doneN} / ${total}`;

  const r = 52, C = 2*Math.PI*r;
  let acc = 0, dim = '', bright = '';
  const legendRows = [];
  LEVELS.forEach(lv=>{
    const items = ALL.filter(i=>i.level===lv);
    const n = items.length, d = items.filter(i=>done.has(i.id)).length;
    const segLen = total ? (n/total)*C : 0;
    const solvedLen = n ? (d/n)*segLen : 0;
    const offset = -acc;
    const color = LV_COLOR[lv];
    dim += `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-opacity=".18" stroke-width="10"
      stroke-dasharray="${segLen} ${C-segLen}" stroke-dashoffset="${offset}"/>`;
    bright += `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${solvedLen} ${C-solvedLen}" stroke-dashoffset="${offset}"/>`;
    acc += segLen;
    legendRows.push(`<div class="row"><span class="dot" style="background:${color}"></span><span class="name">${lv}</span><span class="val">${d} / ${n}</span></div>`);
  });
  document.getElementById('ringSvg').innerHTML = dim + bright;
  document.getElementById('ringLegend').innerHTML = legendRows.join('');

  const dsEl = document.getElementById('domainStats');
  dsEl.innerHTML = DOMAINS.map(d=>{
    const n = d.items.length, dn = d.items.filter(i=>done.has(i.id)).length;
    const p = n ? Math.round(dn/n*100) : 0;
    return `<div class="domain-stat"><div class="row"><span class="name">${d.icon} ${d.name}</span><span class="val">${dn}/${n}</span></div>
      <div class="bar"><i style="width:${p}%"></i></div></div>`;
  }).join('');
}

/* ---------- domain tabs ---------- */
function renderNav(){
  const el = document.getElementById('domainTabs');
  const rows = [{key:'all', icon:'🗂️', name:'全部题目', n:ALL.length},
    ...DOMAINS.map(d=>({key:d.key, icon:d.icon, name:d.name, n:d.items.length}))];
  el.innerHTML = rows.map(r=>`<button class="dtab ${state.dom===r.key?'on':''}" data-dom="${r.key}">
    <span>${r.icon} ${r.name}</span><span class="ct">${r.n}</span></button>`).join('');
  el.querySelectorAll('.dtab').forEach(b=>b.onclick=()=>{state.dom=b.dataset.dom;renderNav();render();window.scrollTo({top:0,behavior:'smooth'})});
}

/* ---------- list ---------- */
function match(it){
  if(state.dom!=='all' && it.dk!==state.dom) return false;
  if(state.lv==='未掌握'){ if(done.has(it.id)) return false; }
  else if(state.lv!=='全部' && it.level!==state.lv) return false;
  const kw = state.kw.trim().toLowerCase();
  if(!kw) return true;
  return (it.q+' '+it.a+' '+it.tags.join(' ')).toLowerCase().includes(kw);
}
function cardHTML(it, idx){
  const kw = state.kw.trim();
  return `<article class="card ${done.has(it.id)?'done':''}" data-id="${it.id}">
    <div class="qrow">
      <div class="qidx"><span class="dot"></span></div>
      <div class="q"><span class="qtext">${idx}. ${hl(it.q,kw)}</span>
        <div class="meta">${it.tags.map(t=>`<span class="tag" data-tag="${esc(t)}">#${esc(t)}</span>`).join('')}</div>
      </div>
      <div class="lv ${it.level}">${it.level}</div>
      <div class="chev">▾</div>
    </div>
    <div class="ans"><div class="ans-in">${hl(it.a,kw)}</div>
      <div class="acts" style="margin-left:16px">
      <button class="mini togg ${done.has(it.id)?'ok':''}">${done.has(it.id)?'✓ 已掌握':'标记已掌握'}</button>
      <button class="mini copy">复制问答</button></div>
    </div></article>`;
}
function render(){
  const box = document.getElementById('content');
  const groups = (state.dom==='all' ? DOMAINS : DOMAINS.filter(d=>d.key===state.dom));
  let html = '', shown = 0;
  groups.forEach(d=>{
    const items = d.items.map(it=>({...it, dk:d.key, dn:d.name})).filter(match);
    if(!items.length) return;
    shown += items.length;
    html += `<section class="sechead"><h2>${d.icon} ${d.name}</h2><span class="d">${items.length} 题 · ${d.desc}</span></section>
      <div class="list-head"><span class="col-status"></span><span class="col-title">题目</span><span class="col-level">难度</span></div>
      <div class="list">${items.map((it,i)=>cardHTML(it,i+1)).join('')}</div>`;
  });
  box.innerHTML = shown ? html : `<div class="empty">没有匹配的题目，换个关键词试试 🔍</div>`;
  bind(box);
}
function bind(box){
  box.querySelectorAll('.card').forEach(c=>{
    const id = c.dataset.id;
    c.querySelector('.qrow').onclick = e => { if(e.target.dataset.tag) return; c.classList.toggle('open'); };
    c.querySelectorAll('.tag').forEach(t=>t.onclick=e=>{e.stopPropagation();document.getElementById('q').value=t.dataset.tag;state.kw=t.dataset.tag;render();});
    c.querySelector('.togg').onclick = e => { e.stopPropagation();
      done.has(id) ? done.delete(id) : done.add(id); save(); renderStats();
      const b = e.target, on = done.has(id);
      b.classList.toggle('ok', on); b.textContent = on ? '✓ 已掌握' : '标记已掌握'; c.classList.toggle('done', on);
      if(state.lv==='未掌握') render();
    };
    c.querySelector('.copy').onclick = e => { e.stopPropagation();
      const it = ALL.find(x=>x.id===id);
      navigator.clipboard.writeText(`Q: ${it.q}\nA: ${it.a}`).then(()=>{e.target.textContent='已复制 ✓';setTimeout(()=>e.target.textContent='复制问答',1400);});
    };
  });
}

/* ---------- controls ---------- */
document.getElementById('q').oninput = e => { state.kw = e.target.value; render(); };
document.getElementById('lvChips').onclick = e => {
  const b = e.target.closest('.chip'); if(!b) return;
  state.lv = b.dataset.lv;
  document.querySelectorAll('#lvChips .chip').forEach(x=>x.classList.toggle('on', x===b));
  render();
};
let expanded = false;
document.getElementById('expandBtn').onclick = e => {
  expanded = !expanded;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('open', expanded));
  e.target.textContent = expanded ? '收起全部' : '展开全部';
};
const themeBtn = document.getElementById('themeBtn');
const setTheme = t => { document.documentElement.dataset.theme = t; localStorage.setItem('qa-theme', t);
  themeBtn.textContent = t==='dark' ? '☀️ 浅色' : '🌙 深色'; };
themeBtn.onclick = () => setTheme(document.documentElement.dataset.theme==='dark' ? 'light' : 'dark');
setTheme(localStorage.getItem('qa-theme') || 'light');
document.getElementById('resetBtn').onclick = () => {
  if(confirm('确定清空所有“已掌握”记录？')){ done = new Set(); save(); renderStats(); render(); }
};

/* ---------- flashcards ---------- */
const modal = document.getElementById('modal');
let deck = [], pos = 0;
function pool(){ const p = ALL.filter(match); return p.length ? p : ALL; }
function openFC(){
  deck = pool().slice().sort(()=>Math.random()-.5); pos = 0;
  if(!deck.length) return; modal.classList.add('on'); showFC();
}
function showFC(){
  const it = deck[pos];
  document.getElementById('fcMeta').textContent = `${it.dn} · ${it.level}`;
  document.getElementById('fcPos').textContent = `${pos+1} / ${deck.length}`;
  document.getElementById('fcQ').textContent = it.q;
  const a = document.getElementById('fcA'); a.textContent = it.a; a.classList.remove('on');
  document.getElementById('fcKnow').textContent = done.has(it.id) ? '✓ 已掌握' : '✓ 标记已掌握';
}
document.getElementById('fcBtn').onclick = openFC;
document.getElementById('fcFlip').onclick = () => document.getElementById('fcA').classList.toggle('on');
document.getElementById('fcNext').onclick = () => { pos = (pos+1) % deck.length; showFC(); };
document.getElementById('fcKnow').onclick = () => { const it = deck[pos]; done.add(it.id); save(); renderStats(); render(); showFC(); };
document.getElementById('fcClose').onclick = () => modal.classList.remove('on');
modal.onclick = e => { if(e.target===modal) modal.classList.remove('on'); };
document.addEventListener('keydown', e => {
  const typing = /input|textarea/i.test(document.activeElement.tagName);
  if(modal.classList.contains('on')){
    if(e.key===' '){ e.preventDefault(); document.getElementById('fcA').classList.toggle('on'); }
    if(e.key==='ArrowRight'){ pos=(pos+1)%deck.length; showFC(); }
    if(e.key==='ArrowLeft'){ pos=(pos-1+deck.length)%deck.length; showFC(); }
    if(e.key==='Escape') modal.classList.remove('on');
    return;
  }
  if(typing) return;
  if(e.key==='/'){ e.preventDefault(); document.getElementById('q').focus(); }
  if(e.key.toLowerCase()==='f') openFC();
});

renderStats(); renderNav(); render();
</script>
</body>
</html>
